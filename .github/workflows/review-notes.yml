# ─── FORK-OWNED, ADDITIVE ─────────────────────────────────────────────────────
#
# This file belongs to this fork, not to apple-shipkit. It is a NEW file rather
# than an edit, which is the whole reason it can exist: AGENTS.md marks `bin/`,
# `ci/`, `Makefile`, `fastlane/Fastfile` and every EXISTING workflow as
# template-owned, so there is no `make check-notes` target to add, no
# `ci/check-review-notes.sh` to write, and no job in `pr.yml` to extend —
# `pr.yml` has exactly four jobs (config, swiftlint, swiftformat, and the `app`
# matrix) and none of them runs a generic repo-level check. Adding a new file to
# this directory is the only placement that does not modify template-owned code.
#
# What it enforces: D-13 — the argument that reaches App Review is the argument
# that was reasoned about. `fastlane/metadata/review_information/notes.txt` is
# generated from the `id=core` block in `docs/REVIEW-ARGUMENTS.md`, and a hand
# edit to either side fails here. Before this workflow existed the drift check
# ran only when somebody remembered to run it, which is the difference between
# "we generate notes.txt" and "notes.txt cannot diverge".
#
# PRESENT IS NOT REQUIRED. This file existing, and even this job going red, does
# not by itself block a merge. Blocking requires `review notes` to be listed as a
# required status check on `main`, which is live GitHub state rather than
# anything in this repository. `bin/setup-github.sh` used to recompute and PUT
# that list from scratch, silently dropping this check on its next run; as of
# 2026-09-02 (04-11) it reads the live array, appends only what is missing, and
# asserts the result, so `make setup-github` and `make bootstrap-fork` now
# preserve this context. `bin/refork-smoketest.sh` still recreates this
# repository from the TEMPLATE, whose copy of that script is unfixed until
# UL-003 merges upstream. The hazard, the exact PATCH that restores it, the
# verification command, and the expected context count of nine are in
# docs/CONTRIBUTING-UPSTREAM.md §6 "Fork operations that `make setup-github`
# reverts". Ledger row UL-003 proposes the upstream fix.
#
# The upstreaming shape for all of this — rename to `bin/gen-review-notes.rb`,
# add a `ci/check-review-notes.sh` wrapper matching `ci/check-app-icon.sh`, and
# add a job to upstream's own `pr.yml` — is written down in
# docs/CONTRIBUTING-UPSTREAM.md and tracked as ledger row UL-001.
# ─────────────────────────────────────────────────────────────────────────────

name: review notes

on:
  # NO `paths:` FILTER, DELIBERATELY. This job is a required status check on
  # `main` and branch protection there runs with `strict: true`. A required
  # check that never fires does not "pass by default" — it leaves the pull
  # request permanently unmergeable, with no way out but an admin edit to
  # protection. A paths filter would trade roughly twenty seconds on
  # ubuntu-latest for a whole class of stuck PRs. Run it every time.
  pull_request:
  push:
    branches: [main]

# Least-privilege token, and nothing beyond it. This workflow checks out
# untrusted pull-request content and runs Ruby over it, so it reads the repo and
# does nothing else: it does not write back, comment, push tags, or receive any
# secret. Note the trigger above is `pull_request` and deliberately NOT its
# `_target` variant: that variant runs with a writable token in the context of
# the base repository while checking out a contributor's code, which is the
# standard way this exact shape becomes a privilege escalation. The variant's
# literal name is not spelled anywhere in this file on purpose, so that a plain
# grep for it over this directory cannot be fooled by a comment explaining why
# it is absent.
permissions:
  contents: read

jobs:
  review-notes:
    # This string becomes the branch-protection status-check context, so it must
    # match the required check exactly, spaces included. Renaming the job
    # silently un-requires the check: protection keeps requiring the old context,
    # which no longer reports, and every PR hangs. See
    # docs/CONTRIBUTING-UPSTREAM.md §6 for the restore and verification commands.
    name: review notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # FULL HISTORY, for the secret scan at the end of this job. The default
          # is a depth-1 checkout, and on one of those gitleaks reports
          # `1 commits scanned … no leaks found` and exits 0 with a
          # committed-then-deleted credential sitting in history (measured on a
          # --depth 1 clone of this repository; recorded in
          # .planning/…/evidence/04-09-T2-gitleaks-controls.txt). A shallow
          # checkout does not make that scan fail, it makes it VACUOUS.
          #
          # THIS LINE IS NOT THE GATE. It is a config line anybody can delete
          # with nothing going red, so tools/gitleaks.rb asserts
          # `git rev-parse --is-shallow-repository` = false itself and exits 2
          # if it is not. Deleting this line therefore breaks the job loudly
          # instead of silently blinding it — which is the only reason it is
          # safe to write a gate's precondition in YAML.
          fetch-depth: 0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: false  # the generator and both suites are stdlib-only; no gems to install

      # Ordered, and failing on the first failure, because the later steps are
      # only meaningful if the earlier ones held.
      #
      # WHAT THE --check STEP DOES NOT PROVE HERE. Its guard has two halves: the
      # generated file matching the doc, and APP_REVIEW_NOTES not overriding the
      # generated file. On a runner `.bootstrap.env` is gitignored and therefore
      # absent, so the `.bootstrap.env` half of that override guard is vacuous —
      # only the process-environment half can fire. The full guard is a local,
      # pre-push property. A green check here means the doc and notes.txt agree;
      # it does not mean nobody's `.bootstrap.env` is about to send Apple
      # something else. Do not read more into this badge than that.
      - name: Check review notes are generated, and pin the tooling that generates them
        run: |
          set -euo pipefail
          ruby tools/gen-review-notes.rb --check
          ruby test/gen_review_notes_test.rb
          ruby test/docs_structure_test.rb
          # Offline by construction, which is what keeps bundler-cache: false
          # above honest: every case drives tools/asc-probe.rb through --fixture
          # with credentials cleared, so this suite needs no gem, no network and
          # no App Store Connect token. It is a step inside this job rather than a
          # job of its own on purpose — a second job would be a tenth status
          # context, which branch protection does not require, so it would run and
          # report and block nothing.
          ruby test/asc_probe_test.rb
          # Identity gate and identity guard (Phase 3, IDENT-07 / IDENT-09). The
          # preflight is criterion 5's gate: every required variable in
          # app/Identity.xcconfig present and non-empty, exit 3 naming the missing one.
          # Running it here is the ONLY coverage the Tuist path has — Tuist has no
          # pre-generation hook, and a guard embedded in Project.swift is skipped
          # whenever the manifest cache is warm — whereas XcodeGen runs it itself via
          # options.preGenCommand. test/identity_test.rb is criterion 1's and
          # criterion 4's durable guard: the five named files carry no template
          # identity literal, the Team ID is in no tracked build config, preGenCommand
          # is wired and cache-proof, and Local.xcconfig is gitignored while Identity.xcconfig
          # is not. All three Ruby files in this step are Ruby core: each has exactly
          # one `require`-family line and it is a require_relative of
          # bin/lib/xcconfig.rb, which itself has ZERO require lines (asserted by
          # test/xcconfig_test.rb below, so it cannot rot).
          # Nothing outside Ruby core is loaded on any path here, which is what keeps
          # bundler-cache: false above honest. WHAT THIS STEP CANNOT DO: this runner
          # is ubuntu-latest with no Xcode, so it runs the preflight's text checks and
          # the Ruby assertions but cannot run the -showBuildSettings parity diff
          # (tools/identity-parity.rb). Criterion 3's gate is a local command whose
          # output is recorded as dated evidence, because all three macos-15 jobs live
          # in template-owned pr.yml and this repository has no fork-owned macOS CI
          # surface. A green badge here says nothing about generator parity.
          ruby bin/preflight-identity.rb
          # bin/lib/xcconfig.rb is the single xcconfig reader (D-57) that the preflight,
          # fastlane and the release workflows are being repointed onto, replacing the three
          # mutually incompatible readers C-17 measured. Its contract test is Ruby core only.
          ruby test/xcconfig_test.rb
          ruby test/identity_test.rb
          # test/fastlane_identity_test.rb is D-58's guard: fastlane/Appfile and
          # fastlane/Fastfile resolve identity through that same parser, with ENV as the
          # only override, no .bootstrap.env tier and NO fallback default — the shape
          # that lets a fork ship under a plausible fake identity instead of failing.
          # It reads text, which is all this runner can do: fastlane is a gem and
          # `bundler-cache: false` above means there are none here. That the guard's
          # abort actually fires through fastlane is observed LOCALLY, both directions,
          # in .planning/…/evidence/04-04-T2-fastlane-integration-controls.txt.
          ruby test/fastlane_identity_test.rb
          # A-01 and A-02's guard (Phase 5). WHAT IT PROVES HERE: the three
          # retired identity keys — APP_NAME, BUNDLE_ID, DISPLAY_NAME — carry no
          # assignment in the tracked .bootstrap.env.example, and nothing under
          # bin/ ci/ fastlane/ reads one of them off the config object; and
          # bin/lib/bootstrap.rb VERIFIES app/Identity.xcconfig rather than
          # writing it, which is the direction A-01 reversed. Both halves read
          # only TRACKED files, which is what makes this suite eligible here at
          # all — its sibling half of the drift question (does a forker's own
          # .bootstrap.env agree with the xcconfig?) structurally cannot run on a
          # runner, because .gitignore excludes that file.
          #
          # WHAT A GREEN BADGE HERE DOES NOT MEAN. It says nothing about any
          # individual fork's .bootstrap.env: the env-vs-xcconfig agreement check
          # and `make doctor` reaching tier 3 both need a real one, and it is
          # absent here. Those stay LOCAL checks with recorded transcripts under
          # the phase's evidence/ directory. Nor does it say the doctor works —
          # this asserts how the identity steps judge their inputs, with
          # xcodebuild stubbed, not that a doctor run on a real tree is green.
          #
          # WHY IT NEEDS NO GEM, which is what keeps bundler-cache: false above
          # honest: bin/lib/bootstrap.rb's top-level requires are base64, digest,
          # fileutils, json, open3, pathname, securerandom, shellwords and tmpdir
          # plus a require_relative of bin/lib/xcconfig.rb, all shipped with the
          # interpreter; every `require "spaceship"` in that file is LAZY, inside
          # a method none of these assertions calls. Verified rather than
          # inherited: after loading this suite, $LOADED_FEATURES matches nothing
          # for spaceship under 3.3.12 and 4.0.6, and with GEM_HOME, GEM_PATH and
          # BUNDLE_GEMFILE all cleared it still exits 0 under 3.3, the version
          # this job pins. (Under 4.0 that same probe fails on base64, which left
          # the default gems in Ruby 3.4 — a bundled gem the interpreter ships,
          # not something bundler installs, so it does not affect this job.)
          #
          # AND NO GENERATED PROJECT. app/App.xcodeproj is gitignored, so the
          # tier-3 assertions substitute a fixture directory; without that they
          # short-circuit to a tier-2 warn and seven of them fail here while
          # passing on a developer machine. Measured in a clone before this line
          # was added, not assumed.
          ruby test/doctor_identity_test.rb
          # IDENT-10's scope assertion (ROADMAP Phase 5 criterion 2). WHAT IT PROVES:
          # bin/rename.sh spells none of the four literals its retired substitution
          # steps used to write — the template bundle id, the display-name placeholder,
          # the app-name sweep token and the Team ID placeholder, each asserted
          # separately and case-insensitively — AND that it still spells the two
          # literals of the steps criterion 2 KEEPS, and still declares both of those
          # steps. That second half is not decoration: without it every assertion in
          # the first half is satisfied by an EMPTY FILE, which is this repository's
          # dominant defect class. Both halves were driven red against a deliberately
          # broken script before this line was added
          # (.planning/…/evidence/05-11-rename-scope-controls.txt).
          #
          # WHAT A GREEN BADGE HERE DOES NOT MEAN. This suite reads TEXT. It says the
          # script no longer spells an identity literal; it does not run the script,
          # and it says nothing about whether a personalization the script performs is
          # correct. Nor can it see a NEW identity surface introduced under a name
          # nobody has frozen into its list — that is tools/check-contamination.rb's
          # job, two steps below, and the two are complementary rather than redundant.
          #
          # Zero require-family lines, so bundler-cache: false above still holds.
          ruby test/rename_scope_test.rb
          # IDENT-11's gate (D-65, D-69). tools/check-contamination.rb asks whether the
          # TEMPLATE's identity — BOTH of them, this fork's original placeholder and the one
          # 04-01's sync brought in from upstream, spelled out in the gate's own header and its
          # frozen LITERALS constant and deliberately not here — still appears in any tracked
          # file outside tools/identity-allowlist.txt, whose every row carries a
          # path, an expected COUNT, an ISO date and a reason. The count is what catches a
          # regression standing next to a legitimate guard literal, which a path-level
          # exemption would swallow; the allowlist is therefore a gate itself, and its stale,
          # short, undated, duplicate and wildcard failures were each observed on the live tree
          # before it was trusted (.planning/…/evidence/04-07-T3-contamination-live-controls.txt).
          #
          # DO NOT CONFUSE THIS WITH ci/check-identity.sh, which pr.yml's non-required `config`
          # job runs. That is upstream's COMPLETENESS check — is the fork's own identity present
          # and non-empty where the build needs it. This is a CONTAMINATION check — is the
          # template's identity absent where it is not permitted. Opposite questions; a green
          # run of one says nothing about the other.
          #
          # It is fork-owned and lives in tools/, NOT at IDENT-11's literal bin/check-identity.sh,
          # because bin/ and ci/ are template-owned and bin/refork-smoketest.sh recreates this
          # repository from the template — a fork-authored file at a template-owned path is
          # deleted wholesale on the next refork, which would silently remove this gate (D-69,
          # the UL-003 failure class). Zero require lines, so bundler-cache: false still holds.
          ruby tools/check-contamination.rb
          ruby test/contamination_test.rb
          # .gitleaks.toml's own gate (IDENT-12, D-62). The secret scan below can
          # only report what its allowlist does not swallow, and one
          # [[allowlists]] entry with a match-everything regex was observed
          # turning an injected high-entropy token from exit 42 into exit 0 with
          # the scan still printing "no leaks found". So the config is checked
          # here, in the same job, BEFORE the scan runs: no catch-all or
          # under-six-character regex, no line-target entry without paths, no
          # description without an ISO date, no `paths` row that matches no
          # tracked file, no key gitleaks would silently ignore — and the version
          # pin agreeing between tools/gitleaks.rb and the step name below.
          ruby test/gitleaks_config_test.rb

      # A SEPARATE, NAMED STEP — and deliberately still a step in THIS job, not a
      # job of its own. A new job would be a tenth status context, and branch
      # protection on `main` requires nine; an unrequired context runs, reports,
      # and blocks nothing (the UL-003 failure class this repository has already
      # been bitten by). Inside `review notes` it inherits a required check.
      #
      # WHY THE BINARY AND NOT THE OFFICIAL ACTION (IDENT-12's whole point).
      # The GitHub Action published by the same project requires a commercial
      # licence for organisation-owned repositories, and this repository is
      # organisation-owned. The gitleaks BINARY is MIT. Its literal name is
      # deliberately not spelled anywhere in this file, and
      # test/gitleaks_config_test.rb greps for it: a comment explaining why
      # something is absent must not be able to make that grep fire. This file
      # already takes the same precaution with the writable-token variant of the
      # pull_request trigger, a few dozen lines above.
      # So the wrapper downloads the pinned 8.30.1 release
      # tarball and verifies its sha256 against the digest published in that
      # release's own checksums file BEFORE unpacking or executing it, then
      # checks the binary reports the pinned version. A tampered digest was
      # observed refusing to run (exit 2) before any of this was trusted.
      #
      # The version is stated here AND in tools/gitleaks.rb: this is what a
      # reader sees in the Actions log, that is what executes.
      # test/gitleaks_config_test.rb fails if the two ever disagree.
      #
      # WHAT THIS STEP CANNOT SEE. It scans `--log-opts=HEAD`, the ancestry of
      # the checked-out commit, which under fetch-depth: 0 on a pull_request is
      # the merge ref — base branch plus the PR's commits. Commits on other refs
      # are out of scope, and one specifically: 33f8e08, which carries a real
      # given name in a fixture, is off `main` via squash and reachable only by
      # SHA. This step does not cover it and nothing here should be read as
      # saying it does; it remains a separate, non-blocking human action. Stale
      # remote branches, dangling objects and reflogs are likewise unreachable,
      # a secret that was never committed is not in git at all, and gitleaks
      # does not detect a low-entropy fake or a credential format its rules have
      # never seen.
      #
      # FAIL-CLOSED. If GitHub Releases is unavailable the wrapper exits 2 and
      # this job goes red; every pull request is blocked until it returns. That
      # is the intended trade for not caching an unverified binary, and a re-run
      # is the remedy.
      - name: Secret scan — pinned gitleaks 8.30.1, full history
        run: ruby tools/gitleaks.rb

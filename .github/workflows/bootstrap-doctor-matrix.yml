# Continuously validates this template's bootstrap pipeline. Three jobs:
#
#   doctor                    — full e2e probe of bin/doctor.rb + bin/lib/bootstrap.rb
#                               across the 2×2 matrix of GENERATOR × RELEASE_MODE
#                               (xcodegen|tuist × ci|local), against real GH +
#                               Apple state via the smoketest fork. Catches
#                               schema breaks, mode-branching bugs, side state
#                               drift. Runs on PR (any change to bootstrap
#                               surface) and workflow_dispatch; SKIPPED on
#                               cron because the Sat (local-mode) + Sun (CI-mode)
#                               destructive canary ships already exercise this
#                               surface via fastlane. The cron trigger remains
#                               on the workflow for the two regression jobs
#                               below — those are hermetic and cheap, worth
#                               weekly sanity coverage against runner-image drift.
#
#   parser-regression         — hermetic test of Bootstrap::Config.parse against
#                               a fixture that mimics the .bootstrap.env.example
#                               shape (every value followed by inline `# comment`).
#                               Catches regression of #108's BLOCKER 2.
#
#   locale-doctor-regression  — runs `make doctor` with LANG, LC_ALL and LC_CTYPE all
#                               cleared, against a fixture .bootstrap.env that carries
#                               non-ASCII bytes. Asserts a VERDICT with no encoding
#                               error and no backtrace, and that the run reached the
#                               metadata-scanning step. Catches regression of GAP-05-01
#                               (UL-048), the fourth instance of that class here.
#                               NOT a required context — see the job header for why.
#
#   bundle-guard-regression   — runs `make doctor` on a fresh checkout WITHOUT
#                               `bundle install`. Asserts friendly-error path
#                               (`Ruby gems aren't installed yet`) instead of
#                               a Bundler::GemNotFound stack trace. Catches
#                               regression of #108's BLOCKER 1.
#
# What this workflow does NOT prove: that `make bootstrap-fork` mints fresh
# certs from cold, that `make ship` produces a working TestFlight build.
# Those are destructive and require Apple-side resource churn (cert quotas,
# ASC App records). For the full destructive E2E, run bin/refork-smoketest.sh
# manually — see docs/CONTINUOUS-VALIDATION.md.
#
# `doctor` job inputs come from GH Secrets on this template repo, never from
# a local .bootstrap.env. The workflow materializes .bootstrap.env at runtime
# in /tmp on the runner and never persists it as an artifact. The two
# regression jobs are hermetic: no secrets, no smoketest needed.

name: bootstrap doctor matrix

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC — fires `parser-regression` + `bundle-guard-regression` only. The `doctor` matrix is SKIPPED on cron (see `if:` gate on that job — its surface is covered by Sat + Sun destructive canary ships).
  workflow_dispatch:
  pull_request:
    paths:
      - 'test/parser_test.rb'
      - 'test/gh_secrets_test.rb'
      - 'Makefile'
      - '.github/workflows/bootstrap-doctor-matrix.yml'
      - 'bin/lib/bootstrap.rb'
      - 'bin/doctor.rb'
      - 'bin/bootstrap-fork.rb'
      - 'bin/ship.rb'
      - 'bin/verify-testflight.rb'
      - 'bin/init-bootstrap-env.sh'
      - '.bootstrap.env.example'
      - 'bin/mint-local-certs.rb'
      - 'fastlane/Fastfile'
      - 'bin/adopt.rb'
      - 'bin/submit.rb'
      - 'bin/lib/version_resolver.rb'
      - 'test/encoding_test.rb'

permissions:
  contents: read

# Serialize per-ref runs. Cron-triggered runs share group `bootstrap-doctor-main`
# with any push/dispatch on main; PR-triggered runs use the PR ref so they can
# proceed in parallel with cron. cancel-in-progress: true keeps PR-only runs
# fresh; cron runs effectively never overlap (they take ~5min, fire weekly).
concurrency:
  group: bootstrap-doctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    # Skip on forks: this workflow references indiagrams/ios-macos-smoketest
    # by hardcoded path and uses secrets configured only on this repo. On any
    # other repo it would fail at the secrets-write step or produce meaningless
    # results. Skipped runs surface as a single grey check, not red errors.
    #
    # Skip on Dependabot PRs: Dependabot-triggered workflow runs don't expose
    # the repo's Actions secrets (GitHub security policy — secrets live in a
    # parallel Dependabot secret store, populated separately via Settings →
    # Security → Dependabot → secrets). Without ASC_API_KEY_ID, FASTLANE_TEAM_ID,
    # ASC_API_KEY_P8_BASE64, MATCH_PASSWORD, MATCH_GIT_BASIC_AUTHORIZATION, and
    # KEYCHAIN_PASSWORD the `.bootstrap.env` materialization step writes empty
    # values and every matrix cell fails the doctor schema check with
    # `.bootstrap.env is missing required fields (RELEASE_MODE=ci): FASTLANE_TEAM_ID,
    # ASC_API_KEY_ID, ASC_API_KEY_ISSUER_ID`. The scheduled Monday 07:00 UTC run
    # (using the repo's normal Actions secrets) and any post-merge manual
    # `workflow_dispatch` re-run cover post-merge verification of action-version
    # bumps. Maintainers who want PR-time doctor coverage on Dependabot bumps
    # can populate the parallel Dependabot secret store with the same 6 secrets.
    # SKIP on schedule events: the Sat (local-mode) + Sun (CI-mode) destructive
    # canary ships already exercise this surface via fastlane within 24-48h of
    # any Monday cron run. The doctor matrix's unique value is PR-time pre-merge
    # feedback on changes to bootstrap.rb / doctor.rb / Fastfile / Makefile.
    # Cron-triggered runs of this workflow only fire the two regression jobs below.
    #
    # Other gates: skip on forks (workflow references indiagrams/ios-macos-smoketest
    # by hardcoded path and uses secrets configured only on this repo). Skip on
    # Dependabot PRs (those runs don't expose Actions secrets — GitHub security
    # policy). Manual workflow_dispatch on this repo always runs.
    if: github.event_name != 'schedule' && github.repository == 'indiagrams/apple-shipkit' && github.actor != 'dependabot[bot]'
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        generator:    [xcodegen, tuist]
        release_mode: [ci, local]

    steps:
      - name: Checkout template (this repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: template

      - name: Clone smoketest (the test target)
        # Public repo; no auth needed. We use the smoketest as a known-state
        # fork to probe doctor against.
        run: |
          git clone --depth=20 https://github.com/indiagrams/ios-macos-smoketest.git smoketest
          ( cd smoketest && git log --oneline -1 )

      - name: Inject this template's bootstrap code into the smoketest checkout
        # The smoketest carries the bootstrap code that was current at its
        # last sync. We want to validate THIS pull request's bootstrap code
        # against the smoketest's runtime state. Replace the smoketest's
        # bin/lib/bootstrap.rb + bin/doctor.rb + bin/bootstrap-fork.rb +
        # bin/ship.rb + bin/verify-testflight.rb + bin/init-bootstrap-env.sh
        # with the template's versions.
        run: |
          mkdir -p smoketest/bin/lib
          cp template/bin/lib/bootstrap.rb smoketest/bin/lib/
          cp template/bin/{doctor.rb,bootstrap-fork.rb,ship.rb,verify-testflight.rb,init-bootstrap-env.sh} smoketest/bin/
          chmod +x smoketest/bin/{doctor.rb,bootstrap-fork.rb,ship.rb,verify-testflight.rb,init-bootstrap-env.sh}
          cp template/.bootstrap.env.example smoketest/

      - name: Set up Ruby + bundler cache (in smoketest)
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: smoketest

      - name: Install xcodegen + tuist (so BrewBootstrap step's `which` checks pass)
        run: |
          # Idempotent — brew skips already-installed.
          brew install xcodegen 2>&1 | tail -3
          brew install --cask tuist 2>&1 | tail -3

      - name: Materialize secrets to mode-0600 files outside the workspace
        env:
          ASC_API_KEY_P8_BASE64:         ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          MATCH_PASSWORD:                ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          KEYCHAIN_PASSWORD:             ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          SECRETS_DIR="${RUNNER_TEMP}/bootstrap-secrets"
          mkdir -p "$SECRETS_DIR"
          chmod 700 "$SECRETS_DIR"

          # ASC API .p8 (decode the base64 to PEM)
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -d > "$SECRETS_DIR/AuthKey.p8"

          # MATCH_GIT_BASIC_AUTHORIZATION = base64("user:PAT") — extract just the PAT
          # for GH_PAT_FILE consumption.
          printf '%s' "$MATCH_GIT_BASIC_AUTHORIZATION" | base64 -d | cut -d: -f2- > "$SECRETS_DIR/pat"

          printf '%s' "$MATCH_PASSWORD"    > "$SECRETS_DIR/match-password"
          printf '%s' "$KEYCHAIN_PASSWORD" > "$SECRETS_DIR/keychain-password"

          chmod 600 "$SECRETS_DIR"/*

          echo "SECRETS_DIR=$SECRETS_DIR" >> "$GITHUB_ENV"

      - name: Use the certs-repo PAT for `gh api` calls (bootstrap.rb probes private repo)
        # The default GITHUB_TOKEN can't see the private smoketest-certs repo.
        # Override `gh`'s auth with the PAT extracted above so probes succeed.
        run: |
          echo "GH_TOKEN=$(cat $SECRETS_DIR/pat)" >> "$GITHUB_ENV"

      - name: Materialize .bootstrap.env from non-secret config + secret file paths
        env:
          GENERATOR:             ${{ matrix.generator }}
          RELEASE_MODE:          ${{ matrix.release_mode }}
          FASTLANE_TEAM_ID:      ${{ secrets.FASTLANE_TEAM_ID }}
          ASC_API_KEY_ID:        ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
        run: |
          # DISPLAY_NAME and ASC_APP_NAME are deliberately SYNTHETIC, in the same
          # register as APP_EMAIL's RFC 2606 doctor-matrix@local.invalid two lines
          # below. Both used to carry a real shipping product's prose name, which is
          # the IDENT-15 / UL-045 blindness class on `main`: it carries NEITHER of the
          # two template identity literals tools/check-contamination.rb is frozen on, so
          # that gate exits 0 on it. (The two literals are deliberately not spelled in
          # this comment: doing so cost the counted allowlist row for this file two extra
          # occurrences, and prose explaining a gate should not have to be exempted from
          # it.) A-08 fixes the named sites; the class stays Phase 6 criterion 7.
          #
          # ASC_APP_NAME is the one that mattered. It is the App Store Connect record
          # name bootstrap creates or renames, and the value the store-listing name
          # is generated from — a fixture must never carry a name a real listing
          # could be renamed to.
          #
          # APP_NAME and BUNDLE_ID are NOT changed here. They are still READ:
          # IdentityAdopted::ENV_AGREEMENT compares them against APP_PRODUCT_NAME and
          # BUNDLE_ID in the smoketest checkout's app/Identity.xcconfig, so they are
          # this cell's subject rather than decoration, and both are template
          # literals covered by a counted row in tools/identity-allowlist.txt.
          # DISPLAY_NAME is not in ENV_AGREEMENT and is not in Config::REQUIRED_ALWAYS
          # — it is inert here, and removing the line rather than re-valuing it is
          # 05-08's deferred item, which needs a real matrix run to validate. This
          # workflow is upstream-only (`github.repository == 'indiagrams/apple-shipkit'`
          # at :102), so no run of it can be produced from this fork.
          cat > smoketest/.bootstrap.env <<EOF
          APP_NAME=SmokeApp
          BUNDLE_ID=com.indiagram.smoke-app
          DISPLAY_NAME='Doctor Matrix Fixture'
          APP_EMAIL=doctor-matrix@local.invalid
          GENERATOR=$GENERATOR
          RELEASE_MODE=$RELEASE_MODE
          FASTLANE_TEAM_ID=$FASTLANE_TEAM_ID
          ASC_API_KEY_ID=$ASC_API_KEY_ID
          ASC_API_KEY_ISSUER_ID=$ASC_API_KEY_ISSUER_ID
          ASC_API_KEY_P8_PATH=$SECRETS_DIR/AuthKey.p8
          GH_ORG=indiagrams
          GH_APP_REPO=ios-macos-smoketest
          GH_CERTS_REPO=ios-macos-smoketest-certs
          GH_PAT_FILE=$SECRETS_DIR/pat
          MATCH_PASSWORD_FILE=$SECRETS_DIR/match-password
          KEYCHAIN_PASSWORD_FILE=$SECRETS_DIR/keychain-password
          ICON_1024_PATH=
          ASC_APP_SKU=indiagram-smoke-001
          ASC_APP_NAME=Doctor Matrix Fixture
          EOF
          # Print without secrets for log clarity
          grep -vE "^(ASC_API_KEY_ID|ASC_API_KEY_ISSUER_ID|FASTLANE_TEAM_ID)=" smoketest/.bootstrap.env || true

      - name: Run make doctor
        working-directory: smoketest
        # ci cells expect exit 0 (everything in place — smoketest is fully bootstrapped).
        # local cells expect exit 2 (LocalKeychainCerts blocks because the runner has
        #   no Apple Distribution + Apple Development + 3rd Party Mac Developer
        #   Installer in its login keychain — that's CORRECT behavior; doctor is
        #   honestly reporting that local-mode signing won't work without the
        #   identities). Exit 1 (Ruby crash) fails the test in either mode.
        # The smoketest's checked-out Makefile may predate the new targets,
        # so invoke the doctor script directly via `bundle exec ruby`. This
        # exercises the same Ruby code `make doctor` would invoke.
        run: |
          set +e
          bundle exec ruby bin/doctor.rb
          rc=$?
          set -e
          mode="${{ matrix.release_mode }}"
          case "$mode/$rc" in
            ci/0)        echo "::notice::ci cell green (rc=0)" ;;
            local/0|local/2)
              echo "::notice::local cell acceptable (rc=$rc)" ;;
            *)
              echo "::error::doctor unexpected rc=$rc in mode=$mode"
              exit 1
              ;;
          esac

      - name: Tear down secrets
        if: always()
        run: rm -rf "$SECRETS_DIR" || true

  # Hermetic regression tests for bin/lib/bootstrap.rb. No secrets, no
  # smoketest needed: both subjects are platform-agnostic and tested in
  # isolation, against synthetic fixtures rather than any real .bootstrap.env.
  #
  #   test/parser_test.rb     — the .bootstrap.env parser. Catches regressions
  #     of #108's BLOCKER 2 (inline `# comments` kept as part of values,
  #     corrupting every downstream Apple/GH probe).
  #   test/gh_secrets_test.rb — GHSecrets issues no `gh variable set`. This job
  #     is where that guard bites, because the `paths:` filter above fires it on
  #     any pull request touching bin/lib/bootstrap.rb, which is the file where
  #     a re-added `gh variable set` would resurrect the two repository
  #     variables D-56 deleted (UL-026's mechanism).
  parser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: false  # both tests are stdlib-only; no bundle exec needed
      - name: Run parser regression fixtures
        run: ruby test/parser_test.rb
      - name: Run GHSecrets repository-variable guard (D-56)
        run: ruby test/gh_secrets_test.rb

  # Regression test for #108's BLOCKER 1: `make doctor` crashed with a
  # Bundler::GemNotFound stack trace on a fresh fork because no path in
  # the README's onboarding ran `bundle install` first. The fix added a
  # `_check-bundle` Makefile guard that prints a friendly hint instead.
  # This job exercises the friendly-failure path by deliberately NOT
  # installing project gems before running `make doctor`.
  bundle-guard-regression:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: false  # the whole point: gems NOT installed
      - name: Confirm test setup (project gems should be missing)
        run: |
          if bundle check >/dev/null 2>&1; then
            echo "::error::Test setup error: bundle check passed; this job needs gems missing"
            exit 1
          fi
          echo "OK — bundle check fails as expected (gems missing)"
      - name: make doctor exits cleanly with friendly message (no Ruby crash)
        run: |
          set +e
          out=$(make doctor 2>&1)
          rc=$?
          set -e
          echo "exit_code=$rc"
          echo "--- output ---"
          echo "$out"
          echo "--- end ---"
          # 1. Friendly bundle-guard message must be present.
          echo "$out" | grep -qF "Ruby gems aren't installed yet" || {
            echo "::error::Friendly bundle-guard message missing — _check-bundle target may have been removed or renamed"
            exit 1
          }
          # 2. Both remediation hints must be present.
          echo "$out" | grep -qF "bundle install" || {
            echo "::error::'bundle install' remediation hint missing"
            exit 1
          }
          echo "$out" | grep -qF "make bootstrap" || {
            echo "::error::'make bootstrap' remediation hint missing"
            exit 1
          }
          # 3. No Ruby stack-trace leakage.
          if echo "$out" | grep -qE 'Bundler::GemNotFound|cannot load such file|spec_set\.rb'; then
            echo "::error::Ruby stack trace leaked through bundle guard — regression of #108 BLOCKER 1"
            exit 1
          fi
          # 4. Non-zero exit (fail-fast, not silent pass-through).
          if [ "$rc" -eq 0 ]; then
            echo "::error::Expected non-zero exit, got rc=0 — _check-bundle guard didn't fire"
            exit 1
          fi
          echo "OK — friendly guard message + non-zero exit + no stack trace"

  # Regression test for GAP-05-01 (UL-048): `make doctor` died with
  # `invalid byte sequence in US-ASCII (ArgumentError)` at the metadata-scanning
  # step on a FRESH CLONE whenever LANG and LC_ALL were unset. Ruby takes the
  # encoding of a file it reads from the environment, so an unpinned read of the
  # tracked copyright file -- which carries U+00A9 eleven bytes in -- handed back a
  # String tagged US-ASCII whose bytes were not, and the regex on the next line
  # raised. Every suite in this repository ran green throughout, because every
  # runner sets a locale.
  #
  # THIS JOB IS DELIBERATELY NOT A REQUIRED CONTEXT, and that is a stated
  # limitation rather than one discovered later. It needs a .bootstrap.env with
  # real-shaped required fields, and .bootstrap.env is gitignored -- structurally
  # absent from a pull-request checkout. The same reason the drift guard could not
  # be a CI gate. The merge-blocking half of this pair is `ruby test/encoding_test.rb`
  # in the `review notes` job, which needs only the checkout and therefore CAN block.
  # A static gate that blocks plus an execution gate that runs is the trade this
  # phase settled on; neither alone is sufficient and saying so here is the point.
  #
  # Hermetic: no secrets. The fixture credentials are shaped, not real, and the
  # private key is generated on the runner. The Apple-facing steps therefore report
  # blocked or advisory, which is exactly what doctor is supposed to do with bad
  # credentials, and is not what this job asserts on.
  #
  # Driven RED before it was trusted: with bin/lib/bootstrap.rb restored to its
  # pre-fix state and this exact fixture, the run produced 15 status lines, 1
  # encoding-error line, no verdict and no metadata step. Fixed: 22 status lines,
  # 0 encoding-error lines, a verdict, and the metadata step present. All three
  # assertions below discriminate; none of them is the exit code, which is 2 in
  # both cases because a fixture-credentialed doctor legitimately blocks steps.
  locale-doctor-regression:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      # Assembled at runtime, never spelled as an address in this file:
      # tools/check-contamination.rb sweeps every tracked file for contact
      # addresses and counts them per path, and a literal here would move a
      # count that another gate asserts.
      FIXTURE_DOMAIN: fixture.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: false  # see the next step: this job's gems must go where the MAKEFILE looks
      # WHY THIS STEP EXISTS AND `bundler-cache: true` DOES NOT WORK HERE.
      # Measured on this job's first-ever run (2026-09-04): it failed with "Ruby
      # gems aren't installed yet", never reaching the metadata step this job is
      # about. ruby/setup-ruby REMOVES /opt/homebrew/opt/ruby@3.3/bin from PATH
      # and installs the gems under its own hostedtoolcache Ruby -- it says so in
      # its log. But Makefile:48 selects the Ruby with `$(wildcard ...)`, a
      # FILESYSTEM test rather than a PATH lookup, so `make` still finds
      # homebrew's ruby@3.3 (present on macos-15), re-prepends it, and points
      # _BUNDLE at a gem home where setup-ruby installed nothing.
      #
      # So the gems are installed with the SAME bundle the Makefile will resolve,
      # mirroring Makefile:45-52 rather than guessing. `bundle check` is asserted
      # here so a future gem problem fails as a gem problem, instead of arriving
      # downstream disguised as a locale regression -- which is exactly how this
      # job first presented.
      - name: Install gems with the same bundle the Makefile resolves
        run: |
          set -euo pipefail
          RUBY_MM=$(awk -F. '{ print $1 "." $2 }' .ruby-version 2>/dev/null || echo 3.3)
          RUBY_BIN="/opt/homebrew/opt/ruby@${RUBY_MM}/bin"
          if [ -x "${RUBY_BIN}/ruby" ]; then
            BUNDLE="${RUBY_BIN}/bundle"
          else
            BUNDLE="bundle"
          fi
          echo "makefile_would_use=${BUNDLE}"
          "${BUNDLE}" install --quiet
          "${BUNDLE}" check
      - name: Materialize a fixture .bootstrap.env that carries non-ASCII bytes
        run: |
          set -euo pipefail
          openssl ecparam -name prime256v1 -genkey -noout \
            | openssl pkcs8 -topk8 -nocrypt -out "$RUNNER_TEMP/fixture.p8"
          chmod 600 "$RUNNER_TEMP/fixture.p8"
          # The non-ASCII line is the WHOLE POINT: without those bytes the run is
          # green with or without the fix, and the control would discriminate
          # nothing. The crash needs the bytes AND the missing locale; either
          # alone is green, which is why both are supplied here.
          {
            printf '# fixture \342\224\200\342\224\200\342\224\200\342\224\200 section rule, and an em dash \342\200\224 both non-ASCII on purpose\n'
            printf 'APP_EMAIL=ci-fixture@%s\n' "$FIXTURE_DOMAIN"
            printf 'GENERATOR=xcodegen\n'
            printf 'RELEASE_MODE=local\n'
            printf 'FASTLANE_TEAM_ID=XXXXXXXXXX\n'
            printf 'ASC_API_KEY_ID=FIXTUREKEY\n'
            printf 'ASC_API_KEY_ISSUER_ID=00000000-0000-0000-0000-000000000000\n'
            printf 'ASC_API_KEY_P8_PATH=%s\n' "$RUNNER_TEMP/fixture.p8"
            printf 'GH_ORG=fixture-org\n'
            printf 'GH_APP_REPO=fixture-repo\n'
          } > .bootstrap.env
          chmod 600 .bootstrap.env
          n=$(LC_ALL=C grep -c '[^ -~	]' .bootstrap.env || true)
          echo "non_ascii_lines=$n"
          if [ "$n" -lt 1 ]; then
            echo "::error::Fixture carries no non-ASCII bytes; this job would pass with or without the fix"
            exit 1
          fi
      - name: make doctor reaches a verdict with the locale cleared
        run: |
          set +e
          out=$(env -u LANG -u LC_ALL -u LC_CTYPE make doctor 2>&1)
          rc=$?
          set -e
          echo "exit_code=$rc   # recorded, NOT asserted: a fixture-credentialed doctor blocks steps legitimately"
          echo "--- output ---"
          echo "$out"
          echo "--- end ---"
          # 1. No inherited-encoding failure, in either of its two spellings.
          if echo "$out" | grep -qE 'invalid byte sequence|Encoding::CompatibilityError'; then
            echo "::error::Inherited-encoding failure under a cleared locale — regression of GAP-05-01 / UL-048"
            exit 1
          fi
          # 2. No Ruby backtrace. A crash with no FAIL text is read as success by a
          #    naive grep, and the subject of this job IS a crash.
          if echo "$out" | grep -qE '\.rb:[0-9]+:in '; then
            echo "::error::Ruby backtrace leaked from make doctor under a cleared locale"
            exit 1
          fi
          # 3. A verdict was actually printed. Without this, a run that died early
          #    for a NEW reason would satisfy 1 and 2 and pass as a fix.
          echo "$out" | grep -qE 'Action required|All steps' || {
            echo "::error::doctor printed no verdict — it stopped before finishing, which is not a fix"
            exit 1
          }
          # 4. The run reached at least the metadata-scanning step, which is the one
          #    that used to crash. Asserted by NAME, not by step number: the number
          #    shifts whenever the pipeline gains or loses a step.
          echo "$out" | grep -qE '^ *[0-9]+\. .*metadata text files' || {
            echo "::error::doctor never reached the metadata-scanning step — it stopped earlier than the fix requires"
            exit 1
          }
          echo "OK — verdict reached, metadata step present, no encoding error, no backtrace"
      - name: Remove the fixture
        if: always()
        run: rm -f .bootstrap.env "$RUNNER_TEMP/fixture.p8"

# ─── FORK-OWNED, ADDITIVE ─────────────────────────────────────────────────────
#
# This file belongs to this fork, not to apple-shipkit. It is a NEW file rather
# than an edit, which is the whole reason it can exist: AGENTS.md marks `bin/`,
# `ci/`, `Makefile`, `fastlane/Fastfile` and every EXISTING workflow as
# template-owned, so there is no `make check-notes` target to add, no
# `ci/check-review-notes.sh` to write, and no job in `pr.yml` to extend —
# `pr.yml` has exactly four jobs (config, swiftlint, swiftformat, and the `app`
# matrix) and none of them runs a generic repo-level check. Adding a new file to
# this directory is the only placement that does not modify template-owned code.
#
# What it enforces: D-13 — the argument that reaches App Review is the argument
# that was reasoned about. `fastlane/metadata/review_information/notes.txt` is
# generated from the `id=core` block in `docs/REVIEW-ARGUMENTS.md`, and a hand
# edit to either side fails here. Before this workflow existed the drift check
# ran only when somebody remembered to run it, which is the difference between
# "we generate notes.txt" and "notes.txt cannot diverge".
#
# PRESENT IS NOT REQUIRED. This file existing, and even this job going red, does
# not by itself block a merge. Blocking requires `review notes` to be listed as a
# required status check on `main`, which is live GitHub state rather than
# anything in this repository. `bin/setup-github.sh` used to recompute and PUT
# that list from scratch, silently dropping this check on its next run; as of
# 2026-09-02 (04-11) it reads the live array, appends only what is missing, and
# asserts the result, so `make setup-github` and `make bootstrap-fork` now
# preserve this context. `bin/refork-smoketest.sh` still recreates this
# repository from the TEMPLATE, whose copy of that script is unfixed until
# UL-003 merges upstream. The hazard, the exact PATCH that restores it, the
# verification command, and the expected context count of nine are in
# docs/CONTRIBUTING-UPSTREAM.md §6 "Fork operations that `make setup-github`
# reverts". Ledger row UL-003 proposes the upstream fix.
#
# The upstreaming shape for all of this — rename to `bin/gen-review-notes.rb`,
# add a `ci/check-review-notes.sh` wrapper matching `ci/check-app-icon.sh`, and
# add a job to upstream's own `pr.yml` — is written down in
# docs/CONTRIBUTING-UPSTREAM.md and tracked as ledger row UL-001.
# ─────────────────────────────────────────────────────────────────────────────

name: review notes

on:
  # NO `paths:` FILTER, DELIBERATELY. This job is a required status check on
  # `main` and branch protection there runs with `strict: true`. A required
  # check that never fires does not "pass by default" — it leaves the pull
  # request permanently unmergeable, with no way out but an admin edit to
  # protection. A paths filter would trade roughly twenty seconds on
  # ubuntu-latest for a whole class of stuck PRs. Run it every time.
  pull_request:
  push:
    # `main`, plus this fork's phase branches. THE SECOND ENTRY IS WHAT LETS A
    # NEW JOB EXECUTE BEFORE ANYBODY COULD MAKE IT REQUIRED, and it was added in
    # 08-16 for exactly that. Measured on this repository 2026-09-11, not
    # assumed: with no pull request open, a push to a topic branch started
    # NOTHING — `pr.yml` is scoped to `[main, master]` on both of its events,
    # and this workflow's push scope was `[main]` alone. The first execution of
    # any job added below would therefore have happened inside a pull request,
    # which is precisely where `locale-doctor-regression` was when it failed on
    # its first ever run and left every pull request unmergeable.
    #
    # The cost is measured too, from run 34529382127 rather than estimated: the
    # jobs here take 55s, 1m37s and 3m29s, in parallel, and
    # `GET .../actions/runs/<id>/timing` reports billable.MACOS.total_ms = 0 on
    # this public repository. Early signal on a phase branch is worth that.
    branches:
      - main
      - 'gsd/**'

# Least-privilege token, and nothing beyond it. This workflow checks out
# untrusted pull-request content and runs Ruby over it, so it reads the repo and
# does nothing else: it does not write back, comment, push tags, or receive any
# secret. Note the trigger above is `pull_request` and deliberately NOT its
# `_target` variant: that variant runs with a writable token in the context of
# the base repository while checking out a contributor's code, which is the
# standard way this exact shape becomes a privilege escalation. The variant's
# literal name is not spelled anywhere in this file on purpose, so that a plain
# grep for it over this directory cannot be fooled by a comment explaining why
# it is absent.
permissions:
  contents: read

jobs:
  review-notes:
    # This string becomes the branch-protection status-check context, so it must
    # match the required check exactly, spaces included. Renaming the job
    # silently un-requires the check: protection keeps requiring the old context,
    # which no longer reports, and every PR hangs. See
    # docs/CONTRIBUTING-UPSTREAM.md §6 for the restore and verification commands.
    name: review notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # FULL HISTORY, for the secret scan at the end of this job. The default
          # is a depth-1 checkout, and on one of those gitleaks reports
          # `1 commits scanned … no leaks found` and exits 0 with a
          # committed-then-deleted credential sitting in history (measured on a
          # --depth 1 clone of this repository; recorded in
          # .planning/…/evidence/04-09-T2-gitleaks-controls.txt). A shallow
          # checkout does not make that scan fail, it makes it VACUOUS.
          #
          # THIS LINE IS NOT THE GATE. It is a config line anybody can delete
          # with nothing going red, so tools/gitleaks.rb asserts
          # `git rev-parse --is-shallow-repository` = false itself and exits 2
          # if it is not. Deleting this line therefore breaks the job loudly
          # instead of silently blinding it — which is the only reason it is
          # safe to write a gate's precondition in YAML.
          fetch-depth: 0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: false  # the generator and both suites are stdlib-only; no gems to install

      # Ordered, and failing on the first failure, because the later steps are
      # only meaningful if the earlier ones held.
      #
      # WHAT THE --check STEP DOES NOT PROVE HERE. Its guard has two halves: the
      # generated file matching the doc, and APP_REVIEW_NOTES not overriding the
      # generated file. On a runner `.bootstrap.env` is gitignored and therefore
      # absent, so the `.bootstrap.env` half of that override guard is vacuous —
      # only the process-environment half can fire. The full guard is a local,
      # pre-push property. A green check here means the doc and notes.txt agree;
      # it does not mean nobody's `.bootstrap.env` is about to send Apple
      # something else. Do not read more into this badge than that.
      - name: Check review notes are generated, and pin the tooling that generates them
        run: |
          set -euo pipefail
          ruby tools/gen-review-notes.rb --check
          ruby test/gen_review_notes_test.rb
          ruby test/docs_structure_test.rb
          # Offline by construction, which is what keeps bundler-cache: false
          # above honest: every case drives tools/asc-probe.rb through --fixture
          # with credentials cleared, so this suite needs no gem, no network and
          # no App Store Connect token. It is a step inside this job rather than a
          # job of its own on purpose — a second job would be a tenth status
          # context, which branch protection does not require, so it would run and
          # report and block nothing.
          ruby test/asc_probe_test.rb
          # Identity gate and identity guard (Phase 3, IDENT-07 / IDENT-09). The
          # preflight is criterion 5's gate: every required variable in
          # app/Identity.xcconfig present and non-empty, exit 3 naming the missing one.
          # Running it here is the ONLY coverage the Tuist path has — Tuist has no
          # pre-generation hook, and a guard embedded in Project.swift is skipped
          # whenever the manifest cache is warm — whereas XcodeGen runs it itself via
          # options.preGenCommand. test/identity_test.rb is criterion 1's and
          # criterion 4's durable guard: the five named files carry no template
          # identity literal, the Team ID is in no tracked build config, preGenCommand
          # is wired and cache-proof, and Local.xcconfig is gitignored while Identity.xcconfig
          # is not. All three Ruby files in this step are Ruby core: each has exactly
          # one `require`-family line and it is a require_relative of
          # bin/lib/xcconfig.rb, which itself has ZERO require lines (asserted by
          # test/xcconfig_test.rb below, so it cannot rot).
          # Nothing outside Ruby core is loaded on any path here, which is what keeps
          # bundler-cache: false above honest. WHAT THIS STEP CANNOT DO: this runner
          # is ubuntu-latest with no Xcode, so it runs the preflight's text checks and
          # the Ruby assertions but cannot run the -showBuildSettings parity diff
          # (tools/identity-parity.rb). Criterion 3's gate is a local command whose
          # output is recorded as dated evidence, because all three macos-15 jobs live
          # in template-owned pr.yml and this repository has no fork-owned macOS CI
          # surface. A green badge here says nothing about generator parity.
          ruby bin/preflight-identity.rb
          # bin/lib/xcconfig.rb is the single xcconfig reader (D-57) that the preflight,
          # fastlane and the release workflows are being repointed onto, replacing the three
          # mutually incompatible readers C-17 measured. Its contract test is Ruby core only.
          ruby test/xcconfig_test.rb
          ruby test/identity_test.rb
          # test/fastlane_identity_test.rb is D-58's guard: fastlane/Appfile and
          # fastlane/Fastfile resolve identity through that same parser, with ENV as the
          # only override, no .bootstrap.env tier and NO fallback default — the shape
          # that lets a fork ship under a plausible fake identity instead of failing.
          # It reads text, which is all this runner can do: fastlane is a gem and
          # `bundler-cache: false` above means there are none here. That the guard's
          # abort actually fires through fastlane is observed LOCALLY, both directions,
          # in .planning/…/evidence/04-04-T2-fastlane-integration-controls.txt.
          ruby test/fastlane_identity_test.rb
          # A-01 and A-02's guard (Phase 5). WHAT IT PROVES HERE: the three
          # retired identity keys — APP_NAME, BUNDLE_ID, DISPLAY_NAME — carry no
          # assignment in the tracked .bootstrap.env.example, and nothing under
          # bin/ ci/ fastlane/ reads one of them off the config object; and
          # bin/lib/bootstrap.rb VERIFIES app/Identity.xcconfig rather than
          # writing it, which is the direction A-01 reversed. Both halves read
          # only TRACKED files, which is what makes this suite eligible here at
          # all — its sibling half of the drift question (does a forker's own
          # .bootstrap.env agree with the xcconfig?) structurally cannot run on a
          # runner, because .gitignore excludes that file.
          #
          # WHAT A GREEN BADGE HERE DOES NOT MEAN. It says nothing about any
          # individual fork's .bootstrap.env: the env-vs-xcconfig agreement check
          # and `make doctor` reaching tier 3 both need a real one, and it is
          # absent here. Those stay LOCAL checks with recorded transcripts under
          # the phase's evidence/ directory. Nor does it say the doctor works —
          # this asserts how the identity steps judge their inputs, with
          # xcodebuild stubbed, not that a doctor run on a real tree is green.
          #
          # WHY IT NEEDS NO GEM, which is what keeps bundler-cache: false above
          # honest: bin/lib/bootstrap.rb's top-level requires are base64, digest,
          # fileutils, json, open3, pathname, securerandom, shellwords and tmpdir
          # plus a require_relative of bin/lib/xcconfig.rb, all shipped with the
          # interpreter; every `require "spaceship"` in that file is LAZY, inside
          # a method none of these assertions calls. Verified rather than
          # inherited: after loading this suite, $LOADED_FEATURES matches nothing
          # for spaceship under 3.3.12 and 4.0.6, and with GEM_HOME, GEM_PATH and
          # BUNDLE_GEMFILE all cleared it still exits 0 under 3.3, the version
          # this job pins. (Under 4.0 that same probe fails on base64, which left
          # the default gems in Ruby 3.4 — a bundled gem the interpreter ships,
          # not something bundler installs, so it does not affect this job.)
          #
          # AND NO GENERATED PROJECT. app/App.xcodeproj is gitignored, so the
          # tier-3 assertions substitute a fixture directory; without that they
          # short-circuit to a tier-2 warn and seven of them fail here while
          # passing on a developer machine. Measured in a clone before this line
          # was added, not assumed.
          ruby test/doctor_identity_test.rb
          # IDENT-10's scope assertion (ROADMAP Phase 5 criterion 2). WHAT IT PROVES:
          # bin/rename.sh spells none of the four literals its retired substitution
          # steps used to write — the template bundle id, the display-name placeholder,
          # the app-name sweep token and the Team ID placeholder, each asserted
          # separately and case-insensitively — AND that it still spells the two
          # literals of the steps criterion 2 KEEPS, and still declares both of those
          # steps. That second half is not decoration: without it every assertion in
          # the first half is satisfied by an EMPTY FILE, which is this repository's
          # dominant defect class. Both halves were driven red against a deliberately
          # broken script before this line was added
          # (.planning/…/evidence/05-11-rename-scope-controls.txt).
          #
          # WHAT A GREEN BADGE HERE DOES NOT MEAN. This suite reads TEXT. It says the
          # script no longer spells an identity literal; it does not run the script,
          # and it says nothing about whether a personalization the script performs is
          # correct. Nor can it see a NEW identity surface introduced under a name
          # nobody has frozen into its list — that is tools/check-contamination.rb's
          # job, two steps below, and the two are complementary rather than redundant.
          #
          # Zero require-family lines, so bundler-cache: false above still holds.
          ruby test/rename_scope_test.rb
          # IDENT-11's gate (D-65, D-69). tools/check-contamination.rb asks whether the
          # TEMPLATE's identity — BOTH of them, this fork's original placeholder and the one
          # 04-01's sync brought in from upstream, spelled out in the gate's own header and its
          # frozen LITERALS constant and deliberately not here — still appears in any tracked
          # file outside tools/identity-allowlist.txt, whose every row carries a
          # path, an expected COUNT, an ISO date and a reason. The count is what catches a
          # regression standing next to a legitimate guard literal, which a path-level
          # exemption would swallow; the allowlist is therefore a gate itself, and its stale,
          # short, undated, duplicate and wildcard failures were each observed on the live tree
          # before it was trusted (.planning/…/evidence/04-07-T3-contamination-live-controls.txt).
          #
          # DO NOT CONFUSE THIS WITH ci/check-identity.sh, which pr.yml's non-required `config`
          # job runs. That is upstream's COMPLETENESS check — is the fork's own identity present
          # and non-empty where the build needs it. This is a CONTAMINATION check — is the
          # template's identity absent where it is not permitted. Opposite questions; a green
          # run of one says nothing about the other.
          #
          # It is fork-owned and lives in tools/, NOT at IDENT-11's literal bin/check-identity.sh,
          # because bin/ and ci/ are template-owned and bin/refork-smoketest.sh recreates this
          # repository from the template — a fork-authored file at a template-owned path is
          # deleted wholesale on the next refork, which would silently remove this gate (D-69,
          # the UL-003 failure class). Zero require lines, so bundler-cache: false still holds.
          ruby tools/check-contamination.rb
          ruby test/contamination_test.rb
          # APP-11 and APP-12 (ROADMAP Phase 6 criterion 5), plan 06-17. Two properties
          # that are TRUE on this tree today and that nothing was watching.
          #
          # APP-11 holds because nobody has changed the two entitlements files. The build
          # does not enforce that: one added key removes the property and every other gate
          # in this repository stays green. So both files are asserted PER FILE — existence,
          # the complete frozen key set, a frozen dated sha256, and a five-key
          # network-capability denylist — against the PARSED plist, never against the file
          # text. That last part is not fussiness: BOTH files name a forbidden capability
          # inside an XML COMMENT, so `grep -q` on either one goes red on a correct tree
          # (06-RESEARCH Pitfall 11). Where plutil exists the stdlib parse is cross-checked
          # against Apple's own; on this runner it is not, and the route taken is PRINTED
          # (entitlements_parse_route=) rather than assumed.
          #
          # APP-12's build half already runs continuously in the required `app (…)` matrix:
          # every target except the two UI-test hosts inherits SWIFT_VERSION 6.0 and
          # SWIFT_STRICT_CONCURRENCY complete, so a source file that fails strict concurrency
          # fails that job. Its OTHER half is not enforced by anything, because both banned
          # escape hatches COMPILE CLEAN — that is what they are for. This gate scans the
          # tracked Swift population under app/ for them with comments stripped by a real
          # scanner, refuses an empty population with exit 2 instead of reporting a clean
          # tree, and never spells either token: both are assembled from character arrays at
          # run time, because a file that configures a content gate is swept by that gate.
          #
          # It also decides, in one place and out loud, what criterion 5's "the app" ranges
          # over — swift6_targets=4, with swift6_excluded_uitest_targets=2 printed as a
          # COUNTED exemption rather than taken silently, and both manifests required to
          # exclude the same targets. tools/identity-parity.rb does not read build settings,
          # so that drift is invisible to every other gate here.
          #
          # WHAT THIS STEP CANNOT DO. There is no Xcode and no codesign on ubuntu-latest, so
          # the BUILT-artefact half does not run here and says so (builtapp_checked=false
          # with its reason). That half is exercised on a developer machine against
          # ad-hoc-signed iOS and macOS bundles, and was driven red by re-signing a copy of
          # the built app with a network entitlement while the source file stayed green.
          # AS OF 2026-09-05 IT ALSO RUNS IN CI: the `built app entitlements` job at the
          # bottom of this file builds both platforms ad-hoc-signed on macos-15 and asserts
          # builtapp_checked=true for each. That job is what closes AR-06; this step's
          # builtapp_checked=false is expected here and is not the residual any more.
          # One require line (digest, a default gem), so bundler-cache: false still holds.
          ruby test/app_offline_test.rb
          # UL-048's gate, and the merge-blocking half of a two-gate pair. Ruby takes the
          # encoding of a file it reads from the environment; with LANG and LC_ALL unset it is
          # US-ASCII, so an unpinned read of tracked text hands back a String whose bytes are
          # not what its tag says, and the next strip, scan or match raises. This repository
          # produced FOUR instances of that one defect, the third of which killed `make doctor`
          # on a fresh clone. Three one-site fixes did not hold, so this gate demands a stated
          # verdict -- pinned, binary, or an exemption carrying a written reason -- for EVERY
          # read in the tracked tree, and fails on a site that has none.
          #
          # WHY IT LIVES HERE, stated rather than chosen silently. It needs the checkout and
          # nothing else: no .bootstrap.env, no secrets, no Xcode, no network. It enumerates
          # through `git ls-files` on whatever tree it is handed, so nothing about its result
          # depends on local state -- which matters, because a suite once certified CI-eligible
          # by unsetting environment variables passed only thanks to a gitignored generated
          # project on disk, and failed 7 assertions in a clone. This one was verified in a
          # clone with the gem paths cleared, under both pinned interpreters.
          #
          # WHAT A GREEN BADGE HERE DOES NOT MEAN. It reads source text plus ONE dynamic probe:
          # a locale-cleared child that runs the real metadata-scanning step against the real
          # tracked copyright file. It does NOT run `make doctor` end to end under a cleared
          # locale. That execution regression lives in bootstrap-doctor-matrix.yml and is not
          # required, because it needs a .bootstrap.env, which is gitignored and structurally
          # absent from a pull-request checkout. The static half blocks merge precisely because
          # the execution half cannot.
          #
          # Zero require-family lines in the gate process, so bundler-cache: false still holds.
          ruby test/encoding_test.rb
          # UL-051's gate, and the direct consequence of the step above. Three of this
          # repository's `bin/` drivers end by launching a subprocess that writes to
          # production: `make adopt` overwrites the local fastlane/metadata and
          # fastlane/screenshots trees from the live App Store Connect record,
          # `make submit` stages or submits a version for App Store review, and
          # `make ship` tags, builds and uploads. None of the three confirms
          # interactively, and until 2026-09-04 none of them parsed arguments --
          # bin/adopt.rb and bin/submit.rb parsed none at all, and bin/ship.rb SNIFFED
          # two with ARGV.include?, which matches exactly or not at all, so --dryrun
          # and --dry_run and --DRY-RUN all shipped for real. A `--help` typed as a
          # usage probe on 2026-09-03 drove the real adoption lane and overwrote 13
          # tracked files.
          #
          # It was strictly WORSE after the encoding fix above: a cleared locale used
          # to crash bin/adopt.rb before its exec, so the obvious probe was safe only
          # because of a defect, and pinning the read removed the accident that was
          # guarding it. bin/submit.rb had the same shape in a different costume -- its
          # only safety was that SUBMIT_FOR_REVIEW is unset by default, and the script
          # itself tells the reader how to set it.
          #
          # HOW IT OBSERVES THAT, which is the only reason this suite is worth a
          # required badge: it never runs a driver in place. It copies each one into a
          # temp directory beside synthetic fixtures and puts a directory first on PATH
          # holding a `bundle`, a `fastlane` and a `gh` that record their argv and exit
          # 0. Reaching one of those shims is the failure condition, and the count is
          # asserted NUMERICALLY rather than through an exit code -- because the exit
          # code discriminates nothing here: --help exited 0 when it ran the lane and
          # exits 0 now that it prints usage. A bare, fully-configured invocation must
          # still reach a shim, per driver, so the suite cannot pass by being incapable
          # of observing a launch at all.
          #
          # It replaced test/adopt_argv_test.rb, which covered one driver with the same
          # harness -- two suites sharing a harness drift, so the harness was generalised
          # over a table of five drivers rather than copied. Three of the five are
          # executed; the other two are asserted safe WITH their reasons, because an
          # unnamed safe driver is indistinguishable from an unaudited one.
          #
          # WHAT A GREEN BADGE HERE DOES NOT MEAN. It proves the FRONT DOORS refuse:
          # --help, -h, an unrecognised argument and every near-miss dry-run spelling
          # reach nothing. It says nothing whatever about the adoption, staging,
          # submission or release lanes, which this suite never reaches by construction,
          # and nothing about whether a run somebody consents to does the right thing.
          # No network, no gem, no .bootstrap.env and no generated project, so
          # bundler-cache: false above still holds.
          ruby test/driver_argv_test.rb
          # .gitleaks.toml's own gate (IDENT-12, D-62). The secret scan below can
          # only report what its allowlist does not swallow, and one
          # [[allowlists]] entry with a match-everything regex was observed
          # turning an injected high-entropy token from exit 42 into exit 0 with
          # the scan still printing "no leaks found". So the config is checked
          # here, in the same job, BEFORE the scan runs: no catch-all or
          # under-six-character regex, no line-target entry without paths, no
          # description without an ISO date, no `paths` row that matches no
          # tracked file, no key gitleaks would silently ignore — and the version
          # pin agreeing between tools/gitleaks.rb and the step name below.
          ruby test/gitleaks_config_test.rb
          # APP-03's data half (plan 06-05). app/Shared/Engine/HTMLEntityTable{A,B}.swift
          # are GENERATED and TRACKED: the generator is the source of truth and the
          # output is reviewable. Two properties are checked here and nowhere else on a
          # pull request, because both are invisible to the compiler.
          #
          # 1. THE COUNT. The obvious packing format for an entity table uses ';' as its
          #    record delimiter, and three entity TARGETS are delimiter characters, so
          #    such a pack loses records. Measured on this tree: 2122 of 2125 parsed,
          #    with `swiftc -typecheck` exiting 0 over the broken tables and emitting no
          #    diagnostic at all. Nothing in the Swift toolchain notices; a count
          #    assertion is the only thing that does. Both halves are asserted
          #    separately and then summed, because a union that has stopped drawing from
          #    one source looks identical to one that never did.
          # 2. PURE ASCII. 17 entities target invisible or format characters. Written as
          #    literal characters they are `invisible_character` errors under
          #    swiftlint --strict — which runs in the macos matrix in pr.yml, not here.
          #    Asserting the byte-level property in Ruby puts it on EVERY pull request.
          #
          # --check never fetches: the WHATWG document is downloaded once, at generation
          # time, on a developer's machine (APP-11). Both files are Ruby core plus
          # json/open3, so bundler-cache: false above still holds.
          ruby tools/gen-html-entities.rb --check
          ruby test/gen_html_entities_test.rb

      # A SEPARATE, NAMED STEP — and deliberately still a step in THIS job, not a
      # job of its own. A new job would be a tenth status context, and branch
      # protection on `main` requires nine; an unrequired context runs, reports,
      # and blocks nothing (the UL-003 failure class this repository has already
      # been bitten by). Inside `review notes` it inherits a required check.
      #
      # WHY THE BINARY AND NOT THE OFFICIAL ACTION (IDENT-12's whole point).
      # The GitHub Action published by the same project requires a commercial
      # licence for organisation-owned repositories, and this repository is
      # organisation-owned. The gitleaks BINARY is MIT. Its literal name is
      # deliberately not spelled anywhere in this file, and
      # test/gitleaks_config_test.rb greps for it: a comment explaining why
      # something is absent must not be able to make that grep fire. This file
      # already takes the same precaution with the writable-token variant of the
      # pull_request trigger, a few dozen lines above.
      # So the wrapper downloads the pinned 8.30.1 release
      # tarball and verifies its sha256 against the digest published in that
      # release's own checksums file BEFORE unpacking or executing it, then
      # checks the binary reports the pinned version. A tampered digest was
      # observed refusing to run (exit 2) before any of this was trusted.
      #
      # The version is stated here AND in tools/gitleaks.rb: this is what a
      # reader sees in the Actions log, that is what executes.
      # test/gitleaks_config_test.rb fails if the two ever disagree.
      #
      # WHAT THIS STEP CANNOT SEE. It scans `--log-opts=HEAD`, the ancestry of
      # the checked-out commit, which under fetch-depth: 0 on a pull_request is
      # the merge ref — base branch plus the PR's commits. Commits on other refs
      # are out of scope, and one specifically: 33f8e08, which carries a real
      # given name in a fixture, is off `main` via squash and reachable only by
      # SHA. This step does not cover it and nothing here should be read as
      # saying it does; it remains a separate, non-blocking human action. Stale
      # remote branches, dangling objects and reflogs are likewise unreachable,
      # a secret that was never committed is not in git at all, and gitleaks
      # does not detect a low-entropy fake or a credential format its rules have
      # never seen.
      #
      # FAIL-CLOSED. If GitHub Releases is unavailable the wrapper exits 2 and
      # this job goes red; every pull request is blocked until it returns. That
      # is the intended trade for not caching an unverified binary, and a re-run
      # is the remedy.
      - name: Secret scan — pinned gitleaks 8.30.1, full history
        run: ruby tools/gitleaks.rb

  # ---------------------------------------------------------------------------
  # AR-06's closure. The `review notes` job above runs `test/app_offline_test.rb`
  # on ubuntu-latest, where there is no Xcode and no `codesign`, so its
  # BUILT-artefact half reports `builtapp_checked=false` and says why. That
  # residual was accepted as AR-06 in 06-SECURITY.md rather than closed silently.
  # This job closes it: same gate, same script, on a runner that can build and
  # inspect a real bundle.
  #
  # WHY IT IS A SEPARATE JOB AND NOT A STEP ABOVE. `review notes` is a REQUIRED
  # status check and its context is this file's `name:` field, spaces included
  # (see the comment on that job). Adding a second job adds a NEW, non-required
  # context; it does not touch the required one. Making this one required too is
  # a branch-protection decision, taken deliberately or not at all.
  #
  # WHY NOT IN pr.yml, which already builds on macos-15. pr.yml is TEMPLATE-owned
  # and editing it is threat T-06-90; fork-authored gates live in this file. The
  # cost of that boundary is one extra macOS build, and it is the right trade.
  built-app-entitlements:
    name: built app entitlements
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # app/App.xcodeproj is generated and gitignored, so it has to be produced
      # before anything can build. XcodeGen only: this gate is about the BUILT
      # bundle's embedded entitlements, which both generators resolve from the
      # same app/*/App.entitlements files, so running it twice would buy nothing.
      - name: install generator
        run: brew install xcodegen

      - name: regenerate Xcode project
        working-directory: app
        run: xcodegen generate

      # AD-HOC SIGNED, AND THAT IS THE WHOLE POINT. pr.yml builds with
      # CODE_SIGNING_ALLOWED=NO, and an unsigned bundle carries NO embedded
      # entitlements blob at all -- measured, both here and during the phase --
      # so the gate correctly refuses to look at one and reports
      # builtapp_checked=false. `CODE_SIGN_IDENTITY=-` is what the gate's own
      # failure reason tells you to use. Debug configuration, which is what the
      # recipe was verified against; it embeds an extra get-task-allow on macOS,
      # and the gate asserts expected-keys-are-a-SUBSET plus a network denylist,
      # so the extra key is tolerated by design.
      - name: build both platforms, ad-hoc signed
        run: |
          set -euo pipefail
          xcodebuild build \
            -project app/App.xcodeproj \
            -scheme App-macOS \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-macos" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES
          xcodebuild build \
            -project app/App.xcodeproj \
            -scheme App-iOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-ios" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES

      # THE ASSERTION THIS JOB EXISTS FOR, and the trap it is written around:
      # app_offline_test.rb exits 0 when builtapp_checked is FALSE. That is
      # correct for the ubuntu job -- a host that cannot look should not fail --
      # but it means a green exit code here would prove nothing if the bundle
      # went missing, the path changed, or a future build stopped signing. A gate
      # that passes without having looked is the exact shape 06-17 drove red on
      # purpose. So the checked flag is asserted explicitly, per platform.
      - name: APP-11 built-artefact gate — embedded entitlements, both platforms
        run: |
          set -euo pipefail
          status=0
          for platform in macos ios; do
            case "$platform" in
              macos) app=$(find "$RUNNER_TEMP/dd-macos/Build/Products" -maxdepth 2 -name '*.app' | head -1) ;;
              ios)   app=$(find "$RUNNER_TEMP/dd-ios/Build/Products"   -maxdepth 2 -name '*.app' | head -1) ;;
            esac
            if [ -z "$app" ]; then
              echo "::error::$platform — no .app was produced; nothing to inspect"
              status=1
              continue
            fi
            echo "=== $platform: $app ==="
            out="$RUNNER_TEMP/offline-$platform.txt"
            # NOT a bare call. Under `set -e -o pipefail` a non-zero exit from the
            # gate would abort the step here -- skipping the OTHER platform and the
            # per-platform diagnosis below. An `if !` condition is exempt from
            # `set -e`, so both platforms always get a verdict and the step still
            # ends red. Measured: a bundle whose signature cannot be read exits 1,
            # while a bundle built unsigned exits 0 with builtapp_checked=false --
            # two different failures that must both be caught, and only one of them
            # shows up in an exit code.
            if ! ruby test/app_offline_test.rb --built-app "$app" 2>&1 | tee "$out"; then
              echo "::error::$platform — the offline gate exited non-zero; see its FAIL lines above"
              status=1
            fi
            grep -E '^builtapp_(checked|reason)=' "$out" || true
            if ! grep -qx 'builtapp_checked=true' "$out"; then
              echo "::error::$platform — builtapp_checked was not true; the built-artefact half did NOT run, so this gate proved nothing about $platform"
              status=1
            fi
          done
          exit "$status"

  # ---------------------------------------------------------------------------
  # PRIV-01's ARCHIVE half, and D-108's closure of AR-06's Release residual.
  #
  # A privacy manifest is a claim about what SHIPS. `test/privacy_manifest_test.rb`
  # run without `--archive` reads app/Shared/PrivacyInfo.xcprivacy, which is the
  # INPUT to a build -- a correct and necessary check that says nothing at all
  # about whether either generator copied the file into the bundle a user
  # installs. This job archives Release, four combinations of two generators and
  # two platforms, and points the same gate at the artefact.
  #
  # WHY THIS TRIGGER, restated because it is the thing most likely to be
  # "optimised" later: this workflow's `on:` block above carries NO `paths:`
  # filter, deliberately, and this job carries no `if:`. Both are the same trap.
  # A required status check that never fires does not pass by default -- it
  # leaves the pull request permanently unmergeable with no way out but an admin
  # edit to protection. Runner minutes are not a counter-argument: this
  # repository is public and `GET .../actions/runs/<id>/timing` returns
  # billable.MACOS.total_ms = 0, measured.
  #
  # WHY HERE AND NOT IN pr.yml, which already builds on macos-15. pr.yml is
  # TEMPLATE-owned and editing it is threat T-06-90; `bin/refork-smoketest.sh`
  # deletes this repository and recreates it from the template, which is what
  # makes that boundary real rather than stylistic. Fork-authored gates live in
  # this file.
  #
  # THE SIGNING RECIPE IS MEASURED, NOT COPIED. 07-RESEARCH.md section 1.1
  # measured `CODE_SIGNING_ALLOWED=NO` and warned against copying the
  # entitlements job's ad-hoc recipe WITHOUT a reason. D-108 supplies the reason
  # -- an unsigned bundle carries no entitlements blob at all, so AR-06's half
  # needs a signed one -- and that combination was then measured locally on all
  # four combinations on 2026-09-06, before this job was written. The result:
  #
  #   * macOS Release ARCHIVE, ad-hoc: WORKS, both generators, and the embedded
  #     blob is the single key com.apple.security.app-sandbox. Note Release drops
  #     the get-task-allow that the Debug entitlements job above tolerates.
  #   * iOS Release archive for a DEVICE destination, ad-hoc: FAILS, both
  #     generators, with `"App-iOS" has entitlements that require signing with a
  #     development certificate`. It fails with AD_HOC_CODE_SIGNING_ALLOWED=YES
  #     and it fails with CODE_SIGN_ENTITLEMENTS emptied. There is no ad-hoc
  #     route to a signed iOS device archive without a development certificate,
  #     and this fork holds none in CI.
  #
  # So the iOS device archive -- the artefact that actually ships -- is built
  # UNSIGNED and carries the privacy half only, and AR-06's iOS half is taken
  # from a Release archive for the SIMULATOR destination, which does sign ad-hoc.
  # That observes a Release-CONFIGURATION entitlements injection, which is
  # exactly what AR-06's residual named; it does not observe the device slice,
  # and the amended AR-06 row says so rather than rounding up.
  privacy-manifest-archive:
    name: privacy manifest archive
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both generators, because the two reach the manifest by DIFFERENT
      # mechanisms -- XcodeGen picks it up through `sources:`, Tuist through an
      # explicit entry -- so parity is not automatic and is the thing this job
      # asserts. `brew update` before the cask is pr.yml's own measured
      # workaround: the runner image bakes a Homebrew snapshot that can lag, and
      # tuist < 4.199.0 ships a broken dyld linkage.
      - name: install both generators
        run: |
          set -e -o pipefail
          brew install xcodegen
          brew update
          brew install --cask tuist

      # THE WHOLE JOB IN ONE STEP, deliberately. Splitting it per generator would
      # make "the second generator still runs when the first fails" depend on a
      # step-level condition; here it is structural -- one accumulator, one exit
      # at the bottom, and every combination reaches a verdict.
      - name: Release archives — privacy manifest in the shipped bundle, and AR-06's Release half
        run: |
          set -e -o pipefail
          status=0

          # Resolve the .app from the ARCHIVE'S OWN METADATA. Never a directory
          # walk filtered by a bundle-suffix glob and truncated to its first hit,
          # and never a path built from a scheme or target name: this repository
          # has three prior instances of that anti-pattern (UL-043, plan 05-04,
          # and a live one in bin/take-readme-screenshots.sh, which looks for a
          # bundle named after the iOS SCHEME when the bundle is actually named
          # from APP_PRODUCT_NAME). The archive tells you where its own app is.
          #
          # The shape is described here rather than spelled. A gate that sweeps
          # this file for the anti-pattern cannot tell an instance from a comment
          # explaining why there is no instance — the self-sweep class four plans
          # in this phase have already paid for.
          app_in_archive() {
            if ! rel=$(plutil -extract ApplicationProperties.ApplicationPath raw -o - "$1/Info.plist" 2>/dev/null); then
              rel=""
            fi
            if [ -z "$rel" ]; then
              echo "::error::$1 — ApplicationProperties.ApplicationPath is unreadable; the archive cannot say where its own app is" >&2
              printf '%s/Products/UNRESOLVED' "$1"
              return 0
            fi
            printf '%s/Products/%s' "$1" "$rel"
          }

          # archive <combo> <scheme> <destination> <signing...>
          archive() {
            combo=$1; scheme=$2; dest=$3; shift 3
            out="$RUNNER_TEMP/archive-$combo.log"
            if ! xcodebuild archive \
                   -project app/App.xcodeproj \
                   -scheme "$scheme" \
                   -configuration Release \
                   -destination "$dest" \
                   -archivePath "$RUNNER_TEMP/$combo.xcarchive" \
                   -derivedDataPath "$RUNNER_TEMP/dd-$combo" \
                   "$@" > "$out" 2>&1; then
              echo "::error::$combo — xcodebuild archive failed; last 40 lines follow"
              tail -40 "$out"
              # THE SILENT CASE, said out loud. A step that produced no archive
              # and then skipped its gate would exit 0 having never looked, and
              # an exit code alone cannot tell that apart from "looked and found
              # nothing wrong". Say the flag here so the transcript carries it.
              echo "privacy_archive_checked=false"
              echo "privacy_archive_reason=no .xcarchive was produced for $combo; nothing was inspected"
              status=1
              return 1
            fi
          }

          # The PRIVACY half: the artefact that actually ships.
          privacy_half() {
            combo=$1
            app=$(app_in_archive "$RUNNER_TEMP/$combo.xcarchive")
            out="$RUNNER_TEMP/privacy-$combo.txt"
            echo "=== $combo: $app ==="
            # NOT a bare call. Under `set -e -o pipefail` a non-zero exit from the
            # gate would abort the step here, skipping every LATER combination and
            # the per-combination diagnosis below. An `if !` condition is exempt
            # from `set -e`, so all four always get a verdict and the step still
            # ends red.
            if ! ruby test/privacy_manifest_test.rb --archive "$RUNNER_TEMP/$combo.xcarchive" 2>&1 | tee "$out"; then
              echo "::error::$combo — the privacy-manifest gate exited non-zero; see its FAIL lines above"
              status=1
            fi
            grep -E '^privacy_(archive_checked|archive_reason|archive_bundle_shape|manifests_in_bundle|manifest_path)=' "$out" || true
            if ! grep -qx 'privacy_archive_checked=true' "$out"; then
              echo "::error::$combo — privacy_archive_checked was not true; the archive half did NOT run, so this job proved nothing about $combo"
              status=1
            fi
          }

          # AR-06's half: the embedded entitlements blob, in a RELEASE build.
          entitlements_half() {
            combo=$1
            app=$(app_in_archive "$RUNNER_TEMP/$combo.xcarchive")
            out="$RUNNER_TEMP/offline-$combo.txt"
            echo "=== $combo (AR-06): $app ==="
            if ! ruby test/app_offline_test.rb --built-app "$app" 2>&1 | tee "$out"; then
              echo "::error::$combo — the offline gate exited non-zero; see its FAIL lines above"
              status=1
            fi
            grep -E '^builtapp_(checked|reason)=' "$out" || true
            if ! grep -qx 'builtapp_checked=true' "$out"; then
              echo "::error::$combo — builtapp_checked was not true; the built-artefact half did NOT run, so this job proved nothing about $combo's entitlements"
              status=1
            fi
          }

          # The two iOS DEVICE archives are unsigned, so they are deliberately not
          # sent to the offline gate -- measured 2026-09-06: that gate exits 1 on an
          # unsigned bundle, `codesign -d --entitlements read the bundle's embedded
          # entitlements (exit 1)`, which would be a red for a known limitation
          # rather than for a defect. PIN THE REASON so the exclusion cannot widen
          # silently: assert the bundle really is unsigned. If a development
          # certificate ever reaches this job, this goes red and whoever added it
          # widens the gate instead of inheriting an exemption nobody re-read.
          assert_unsigned() {
            combo=$1
            app=$(app_in_archive "$RUNNER_TEMP/$combo.xcarchive")
            if codesign -dv "$app" > /dev/null 2>&1; then
              echo "::error::$combo — this bundle IS signed. It was excluded from AR-06's half only because an iOS device archive cannot be ad-hoc signed without a development certificate. That is no longer true here, so send it to test/app_offline_test.rb --built-app and delete this branch"
              status=1
            else
              echo "$combo: unsigned as expected — privacy half only, AR-06's iOS half is taken from the simulator-destination Release archive"
            fi
          }

          run_generator() {
            gen=$1
            echo "########## generator: $gen ##########"
            # The shipped shapes, for the privacy half.
            archive "$gen-ios"    App-iOS   'generic/platform=iOS'   CODE_SIGNING_ALLOWED=NO && privacy_half "$gen-ios" && assert_unsigned "$gen-ios"
            archive "$gen-macos"  App-macOS 'generic/platform=macOS' \
              CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
              && privacy_half "$gen-macos" && entitlements_half "$gen-macos"
            # AR-06's iOS half only: Release configuration, ad-hoc signed, which a
            # simulator destination allows and a device destination does not.
            archive "$gen-ios-sim" App-iOS 'generic/platform=iOS Simulator' \
              CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
              && entitlements_half "$gen-ios-sim"
            # Never let this function's own exit status be the last archive's.
            # Failures are carried by `status`, and a non-zero return here would
            # abort the step under `set -e` and skip the OTHER generator entirely.
            return 0
          }

          # XcodeGen FIRST. bin/switch-to-tuist.sh --force deletes app/project.yml,
          # so the order is not interchangeable. It is safe here and only here:
          # this checkout is disposable. NEVER run that script on a development
          # tree -- it also edits Brewfile, Makefile and two ci/ scripts.
          if ! ( cd app && xcodegen generate ); then
            echo "::error::xcodegen generate failed — the XcodeGen half of this job did NOT run and proved nothing"
            status=1
          else
            run_generator xcodegen
          fi

          if ! bin/switch-to-tuist.sh --force; then
            echo "::error::bin/switch-to-tuist.sh failed — the Tuist half of this job did NOT run and proved nothing"
            status=1
          elif ! ( cd app && tuist generate --no-open ); then
            echo "::error::tuist generate failed — the Tuist half of this job did NOT run and proved nothing"
            status=1
          else
            # PUT app/project.yml BACK before any gate runs. switch-to-tuist.sh
            # `git rm`s it, which is exactly its job -- a Tuist fork keeps one
            # manifest -- but BOTH gates below enumerate their population as the
            # UNION of the two generator manifests and assert the two AGREE. On a
            # tree with one of them deleted the privacy gate correctly refuses a
            # verdict: `CANNOT RUN: app/project.yml not found ... the population
            # cannot be enumerated`, exit 2, no verdict printed. Measured
            # 2026-09-06 by running this very script in a disposable local clone,
            # which is where that defect was found instead of on a runner. The
            # deletion is STAGED, so a plain `git checkout --` does not undo it.
            # Nothing is misrepresented by restoring it: app/App.xcodeproj was
            # produced by Tuist a moment ago and putting a manifest file back
            # cannot retroactively change what is already generated.
            if ! git checkout HEAD -- app/project.yml; then
              echo "::error::could not restore app/project.yml after switch-to-tuist.sh — both gates would refuse a verdict and the Tuist half would prove nothing"
              status=1
            else
              run_generator tuist
            fi
          fi

          exit "$status"

  # ---------------------------------------------------------------------------
  # 08-16 — THE FIRST OF TWO NEW JOBS, AND DELIBERATELY *NOT* A REQUIRED STATUS
  # CONTEXT IN THIS PHASE.
  #
  # `main` requires ELEVEN contexts (read read-only before and after this landed;
  # the two lists are byte-identical and neither contains a name from these two
  # jobs). THREE of the eleven are this file's own jobs — `review notes`,
  # `built app entitlements`, `privacy manifest archive` — so adding a
  # `ruby test/...` line to any of them would have turned a gate that had NEVER
  # EXECUTED into a merge blocker on its first push. That is not hypothetical:
  # `locale-doctor-regression` was written in 05-18 to protect a fixed defect,
  # failed on its FIRST EVER RUN three weeks later, and failed on its own SETUP
  # rather than on its subject — `ruby/setup-ruby` drops the Homebrew Ruby from
  # PATH while `Makefile:48` selects Ruby by a filesystem test, so `make` found a
  # Ruby with no gems and died before reaching the step under test. Every pull
  # request was unmergeable until it was fixed.
  #
  # WHAT WOULD HAVE TO BE TRUE BEFORE ANYBODY ADDS THIS NAME TO PROTECTION:
  # several green runs on real pushes AND a demonstrated red — somebody breaks
  # the subject on purpose and watches this job catch it. Requiring it before
  # both exist is requiring an untested belief with CI syntax.
  store-copy-gate:
    name: store copy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: false  # this gate is stdlib-only; no gems to install

      # THE SETUP, ASSERTED APART FROM THE SUBJECT, AS ITS OWN STEP.
      # `locale-doctor-regression`'s failure was only legible because one of its
      # checks asserted it had REACHED its subject. A broken environment must
      # fail AS a broken environment, with its own message, before any verdict
      # about store copy is even attempted.
      - name: preconditions — the interpreter, the one require, and the trees the gate reads
        run: |
          set -euo pipefail
          command -v ruby > /dev/null 2>&1 || { echo "::error::no ruby on PATH — nothing below ran"; exit 1; }
          v=$(ruby -e 'print RUBY_VERSION')
          echo "precondition_ruby=$v at $(command -v ruby)"
          case "$v" in
            3.3.*) ;;
            *) echo "::error::expected Ruby 3.3.x (the interpreter this gate was measured under); got $v"; exit 1 ;;
          esac
          ruby -e 'require "json"' || { echo "::error::the one require this gate makes — json, a default gem — did not resolve, so bundler-cache: false is not the reason it would fail"; exit 1; }
          for p in fastlane/metadata/en-US fastlane/metadata-macos/en-US fastlane/metadata/review_information/notes.txt app/Shared/Localizable.xcstrings; do
            [ -e "$p" ] || { echo "::error::$p is missing from the checkout; the gate would refuse and this job would prove nothing about store copy"; exit 1; }
            echo "precondition_path=$p"
          done
          n=$(find fastlane/metadata/en-US -maxdepth 1 -name '*.txt' | wc -l | tr -d ' ')
          echo "precondition_ios_listing_files=$n"
          [ "$n" -gt 0 ] || { echo "::error::the iOS listing tree holds no .txt file — a scan over an empty tree reports compliance it never looked for"; exit 1; }

      # WHAT THIS GATE PROVES: that the copy which reaches App Review is the copy
      # this repository reviewed. It enumerates both listing trees plus the
      # review notes, holds them against `app/Shared/Localizable.xcstrings` — the
      # strings a user actually reads — and fails on placeholder prefixes,
      # example-domain URLs, byte-length ceilings App Store Connect enforces, and
      # a macOS description that has silently drifted from the iOS one.
      #
      # WHY IT NEEDS NO GEM, so `bundler-cache: false` above stays honest: the
      # file makes exactly ONE require, `json`, which is a DEFAULT gem shipped
      # with the interpreter. It shells out to nothing at all — no IO.popen, no
      # system(), no backticks — so it has no tool dependency either. Measured in
      # a fresh clone of this repository before this job was written.
      #
      # EXIT 2 IS NOT A PASS. The gate refuses with `CANNOT RUN:` when a tree it
      # must enumerate is missing or empty, because a scan over nothing asserts
      # nothing and prints success. All three outcomes are discriminated below,
      # and the gate's own printed facts are checked as well as its status — a
      # green conclusion with no facts is a job that never reached its subject.
      - name: Store listing copy — both trees, the review notes, and the strings catalog
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/store-copy.txt"
          gate_exit=0
          # Redirected to a FILE, with the status read on the next statement.
          # Never piped: `ruby ... | tee` reports tee's status, which is how a
          # red gate has gone green in this repository before.
          ruby test/store_copy_test.rb > "$out" 2>&1 || gate_exit=$?
          cat "$out"
          echo "store_copy_gate_exit=$gate_exit"
          case "$gate_exit" in
            0) echo "store copy — the gate read both listing trees and every assertion held" ;;
            1) echo "::error::store copy — the gate ran and FAILED. Its FAIL lines are above"; exit 1 ;;
            2) echo "::error::store copy — the gate REFUSED (exit 2, CANNOT RUN). It inspected nothing, which is not a pass"; exit 1 ;;
            *) echo "::error::store copy — exit $gate_exit is neither its pass (0), its failure (1) nor its refusal (2); that is evidence for no side"; exit 1 ;;
          esac
          ios=$(sed -n 's/^store_copy_from_ios=//p' "$out")
          mac=$(sed -n 's/^store_copy_from_macos=//p' "$out")
          tot=$(sed -n 's/^store_copy_total=//p' "$out")
          echo "store_copy_from_ios=$ios store_copy_from_macos=$mac store_copy_total=$tot"
          if [ -z "$ios" ] || [ -z "$mac" ] || [ -z "$tot" ]; then
            echo "::error::store copy — the gate exited 0 without printing its own named facts; a conclusion with no facts does not show it reached its subject"
            exit 1
          fi
          if [ "$ios" -le 0 ] || [ "$mac" -le 0 ] || [ "$tot" -le 0 ]; then
            echo "::error::store copy — the gate reported an EMPTY population (ios=$ios macos=$mac total=$tot). Each source's contribution is asserted separately because a union that has stopped drawing from one source looks identical to one that never did"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 08-16 — THE SECOND NEW JOB, AND ALSO DELIBERATELY *NOT* A REQUIRED STATUS
  # CONTEXT IN THIS PHASE. The reason above applies unchanged, and one more
  # applies here specifically: `built app entitlements` (:453) already builds on
  # macos-15 and is ALREADY a required context, so appending two `ruby test/...`
  # lines to it would have been the cheapest possible way to make two
  # never-executed gates block every merge in the repository. One extra macOS
  # build is the price of that not happening, and it is the right price.
  #
  # WHY ONE JOB FOR TWO GATES: they need the SAME artefact, and building it twice
  # would buy nothing. `test/icon_set_test.rb` needs `sips` and `iconutil` — by
  # name; it refuses at exit 2 if either is off PATH — and takes the built bundle
  # as its fifth source. `test/built_plist_test.rb` needs a built `.app` outright.
  # Neither can run on ubuntu, and both read the same bundle.
  #
  # RELEASE, NOT DEBUG, and that is the one deliberate difference from the job at
  # :453, which builds Debug. UL-063: a built-artefact gate pointed at a Debug
  # build is a claim about a build nobody ships. Everything else mirrors that
  # job — same `-project`, same `-scheme` paired with a destination (never an
  # unpinned `-scheme`), same ad-hoc signing triple.
  icon-and-built-plist:
    name: icon set and built plist
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # app/App.xcodeproj is generated and gitignored, so it has to be produced
      # before anything can build — the same reason the job at :453 installs a
      # generator. XcodeGen only: both gates below read a built bundle, and the
      # two generators resolve its icon and its plist keys from the same
      # manifests, so running both would double the runtime and buy nothing here.
      - name: install generator
        run: brew install xcodegen

      - name: regenerate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: build macOS Release, ad-hoc signed
        run: |
          set -euo pipefail
          xcodebuild build \
            -project app/App.xcodeproj \
            -scheme App-macOS \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-macos-release" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES

      # Ruby is pinned AFTER the build on purpose. `locale-doctor-regression`
      # died because this action removed the Homebrew Ruby from PATH underneath a
      # Makefile that picked its interpreter by a filesystem test; nothing above
      # this line depends on which Ruby is first on PATH any more, and nothing
      # below it shells out to `make`. The two gates are pinned to 3.3 because
      # 3.3 is the interpreter both were measured under.
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: false  # both gates are stdlib-only; no gems to install

      # THE SETUP, ASSERTED APART FROM THE SUBJECT. Every tool both gates depend
      # on, the interpreter, the two requires, and the built bundle itself — each
      # with its own failure message, so a broken runner fails AS a broken runner
      # and is never mistaken for a bad icon or a missing plist key.
      - name: preconditions — the macOS tools, the interpreter, and the built bundle
        run: |
          set -euo pipefail
          for t in sips iconutil plutil; do
            command -v "$t" > /dev/null 2>&1 || { echo "::error::$t is not on PATH. test/icon_set_test.rb refuses at exit 2 without sips or iconutil, and the plist read falls back to plutil; a run that cannot read a pixel or open a bundle has not inspected anything"; exit 1; }
            echo "precondition_tool=$t at $(command -v "$t")"
          done
          [ -x /usr/libexec/PlistBuddy ] || { echo "::error::/usr/libexec/PlistBuddy is missing; source D resolves the bundle's icon name through it"; exit 1; }
          echo "precondition_tool=PlistBuddy at /usr/libexec/PlistBuddy"
          v=$(ruby -e 'print RUBY_VERSION')
          echo "precondition_ruby=$v at $(command -v ruby)"
          case "$v" in
            3.3.*) ;;
            *) echo "::error::expected Ruby 3.3.x (the interpreter both gates were measured under); got $v"; exit 1 ;;
          esac
          ruby -e 'require "json"' || { echo "::error::json did not resolve — test/icon_set_test.rb makes exactly one require and it is this one"; exit 1; }
          ruby -e 'require "rexml/document"' || { echo "::error::rexml did not resolve — test/built_plist_test.rb makes exactly one require and it is this one"; exit 1; }
          for p in bin/lib/xcconfig.rb app/Identity.xcconfig app/macOS/Resources/AppIcon.icns ci/check-app-icon.sh; do
            [ -e "$p" ] || { echo "::error::$p is missing from the checkout; a gate that cannot open its own source of truth proves nothing"; exit 1; }
            echo "precondition_path=$p"
          done
          products="$RUNNER_TEMP/dd-macos-release/Build/Products"
          [ -d "$products" ] || { echo "::error::$products does not exist — the build step produced no products tree"; exit 1; }
          # COUNTED, not truncated to a first hit. This repository has picked the
          # wrong bundle three times by taking the head of a filtered directory
          # walk (UL-043, UL-049); if the walk is ever ambiguous this says so and
          # stops instead of silently inspecting whichever one sorted first.
          count=$(find "$products" -maxdepth 2 -name '*.app' -type d | wc -l | tr -d ' ')
          echo "precondition_built_app_candidates=$count"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one .app under $products, found $count. Both gates below would be reading a bundle nobody chose"
            find "$products" -maxdepth 2 -name '*.app' -type d || true
            exit 1
          fi
          app=$(find "$products" -maxdepth 2 -name '*.app' -type d)
          [ -f "$app/Contents/Info.plist" ] || { echo "::error::$app has no Contents/Info.plist, so it is not a macOS bundle and neither gate has a subject"; exit 1; }
          echo "precondition_built_app=$app"
          echo "BUILT_APP=$app" >> "$GITHUB_ENV"

      # WHAT THIS GATE PROVES: that the icon a user sees is the icon this
      # repository holds. It unions five sources — both `.appiconset`s, every
      # member `iconutil` extracts from the shipped `.icns`, the generator's
      # 1024px input, and the `.icns` INSIDE the built bundle — asserts each
      # source's contribution separately, decodes the raw ARGB members to prove
      # their mandatory alpha channel is fully opaque, and takes
      # `ci/check-app-icon.sh`'s independent verdict alongside its own.
      #
      # WHY IT NEEDS NO GEM: exactly one require, `json`, a DEFAULT gem. Its
      # dependencies are EXECUTABLES, not gems — `sips`, `iconutil`, PlistBuddy,
      # and `/bin/bash` for the template gate — which is why this job exists on
      # macos-15 at all and why the step above asserts each one by name.
      #
      # --built-app IS THE POINT OF RUNNING IT HERE. Without it the gate still
      # passes, reporting `icon_slots_from_built_app=0` and saying so; a job that
      # accepted that would be green on four sources while claiming five. The
      # contribution is therefore asserted to be non-zero below.
      - name: App icon — five sources, including the .icns inside the built bundle
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/icon-set.txt"
          gate_exit=0
          ruby test/icon_set_test.rb --built-app "$BUILT_APP" > "$out" 2>&1 || gate_exit=$?
          cat "$out"
          echo "icon_gate_exit=$gate_exit"
          case "$gate_exit" in
            0) echo "icon set — the gate read all five sources and every assertion held" ;;
            1) echo "::error::icon set — the gate ran and FAILED. Its FAIL lines are above"; exit 1 ;;
            2) echo "::error::icon set — the gate REFUSED (exit 2, CANNOT RUN). It inspected nothing, which is not a pass; its own line above names the tool or file it could not reach"; exit 1 ;;
            *) echo "::error::icon set — exit $gate_exit is neither its pass (0), its failure (1) nor its refusal (2); that is evidence for no side"; exit 1 ;;
          esac
          built=$(sed -n 's/^icon_slots_from_built_app=//p' "$out")
          route=$(sed -n 's/^icon_built_app_route=//p' "$out")
          unenum=$(sed -n 's/^icon_unenumerated=//p' "$out")
          tmpl=$(sed -n 's/^icon_template_gate_exit=//p' "$out")
          echo "icon_slots_from_built_app=$built icon_built_app_route=$route icon_unenumerated=$unenum icon_template_gate_exit=$tmpl"
          if [ -z "$built" ] || [ -z "$route" ] || [ -z "$unenum" ]; then
            echo "::error::icon set — the gate exited 0 without printing its own named facts; a conclusion with no facts does not show it reached its subject"
            exit 1
          fi
          if [ "$built" -le 0 ]; then
            echo "::error::icon set — source D contributed $built members, so --built-app never reached the bundle and this run inspected the repository sources only while reporting five (route: $route)"
            exit 1
          fi

      # WHAT THIS GATE PROVES: that the submission-critical Info.plist keys are
      # in the BUILT bundle rather than in a manifest that is supposed to produce
      # them. Both `Generated-Info.plist` files are generated and gitignored, and
      # the tracked manifests say `$(PRIVACY_POLICY_URL)` rather than a URL — only
      # a build resolves it. It asserts the privacy URL is present, decomposes it
      # (an xcconfig `//` opens a comment at any position, so a plainly written
      # URL resolves to the six characters `https:` — measured on Xcode 26.1.1),
      # requires it to EQUAL the one identity source rather than merely exist,
      # asserts the macOS category, and asserts the export-compliance key is
      # literally false.
      #
      # WHY IT NEEDS NO GEM: exactly one require, `rexml/document`, which ships
      # with the interpreter; `bin/lib/xcconfig.rb` is `load`ed as a tracked file,
      # the idiom `fastlane/Appfile` already uses, so the one-require promise
      # holds under `bundler-cache: false`.
      #
      # EXIT 2 IS THIS GATE'S REFUSAL PATH AND IT IS THE TRAP THIS STEP IS BUILT
      # AROUND. Run with no `--built-app` it exits 2 with `CANNOT RUN:` and prints
      # every one of its facts as `unread` — measured in a fresh clone. A job that
      # ran it bare would be green on a refusal. So the artefact is supplied, 0/1/2
      # are discriminated separately, AND the facts are checked for the literal
      # `unread`, because that string is what "nothing was inspected" looks like.
      - name: Built Info.plist — the privacy URL, the category, and export compliance
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/built-plist.txt"
          gate_exit=0
          ruby test/built_plist_test.rb --built-app "$BUILT_APP" > "$out" 2>&1 || gate_exit=$?
          cat "$out"
          echo "built_plist_gate_exit=$gate_exit"
          case "$gate_exit" in
            0) echo "built plist — the gate read the bundle and every assertion held" ;;
            1) echo "::error::built plist — the gate ran and FAILED. Its FAIL lines are above"; exit 1 ;;
            2) echo "::error::built plist — the gate REFUSED (exit 2, CANNOT RUN). Nothing was inspected, which is NOT a pass and NOT a failure of the subject"; exit 1 ;;
            *) echo "::error::built plist — exit $gate_exit is neither its pass (0), its failure (1) nor its refusal (2); that is evidence for no side"; exit 1 ;;
          esac
          status=0
          for f in platform privacy_url category encryption parse_route; do
            val=$(sed -n "s/^built_plist_$f=//p" "$out")
            echo "built_plist_$f=$val"
            if [ -z "$val" ]; then
              echo "::error::built plist — built_plist_$f was never printed; a conclusion with no facts does not show the gate reached its subject"
              status=1
            elif [ "$val" = "unread" ]; then
              echo "::error::built plist — built_plist_$f is 'unread', which is the value this gate prints when it inspected NOTHING. The exit code said otherwise and the facts win"
              status=1
            fi
          done
          exit "$status"

  # ---------------------------------------------------------------------------
  # PHASE 8 CLOSE-OUT (2026-09-14) — AND DELIBERATELY *NOT* A REQUIRED STATUS
  # CONTEXT, for exactly the reason the 08-16 block above records.
  #
  # `app source rules` has NEVER EXECUTED on a runner. Adding `ruby
  # test/app_source_rules_test.rb` to `review notes` — a required context — would
  # have made a never-executed gate a merge blocker on its first push, which is
  # the `locale-doctor-regression` failure verbatim: it died on its own SETUP
  # rather than on its subject and left every pull request unmergeable. Its own
  # job costs one ubuntu runner and risks nothing.
  #
  # WHAT WOULD HAVE TO BE TRUE BEFORE THIS NAME GOES INTO PROTECTION, unchanged
  # from the bar 08-16 set: several green runs on real pushes AND a demonstrated
  # red — somebody breaks one of the two subjects on purpose and watches this job
  # catch it. Both subjects were driven red LOCALLY on 2026-09-14 (re-adding
  # `private` to `UITestWindowSizer`; stripping the iOS submit guard), each going
  # exit 1 with the right message and back to green on restore. Local is not a
  # runner, so that is evidence for the gate and not yet for the context.
  #
  # WHAT IT PROVES: two source invariants that a compiler, a linter and a
  # formatter all accept happily and that the shipped app is nonetheless wrong
  # without — UL-087's window identity, and CR-01's ungated App Review
  # submission. Both were, at the moment they were fixed, protected by a comment
  # asking the next reader not to undo them.
  app-source-rules:
    name: app source rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: false  # this gate is stdlib-only and makes ZERO requires

      # THE SETUP, ASSERTED APART FROM THE SUBJECT — same shape and same reason
      # as the store-copy gate above. A broken environment must fail AS a broken
      # environment before any verdict about the source is attempted.
      - name: preconditions — the interpreter and the two files the gate reads
        run: |
          set -euo pipefail
          command -v ruby > /dev/null 2>&1 || { echo "::error::no ruby on PATH — nothing below ran"; exit 1; }
          v=$(ruby -e 'print RUBY_VERSION')
          echo "precondition_ruby=$v at $(command -v ruby)"
          case "$v" in
            3.3.*) ;;
            *) echo "::error::expected Ruby 3.3.x (the interpreter this gate was measured under); got $v"; exit 1 ;;
          esac
          for p in app/Shared/App.swift fastlane/Fastfile.local; do
            [ -e "$p" ] || { echo "::error::$p is missing from the checkout; the gate would report a file that does not exist and prove nothing about the source"; exit 1; }
            echo "precondition_path=$p"
          done

      - name: app source rules — UL-087 window identity, CR-01 submission guard
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/app-source-rules.txt"
          set +e
          ruby test/app_source_rules_test.rb 2>&1 | tee "$out"
          gate_exit=${PIPESTATUS[0]}
          set -e
          echo "app_source_rules_gate_exit=$gate_exit"
          case "$gate_exit" in
            0) echo "app source rules — both invariants hold" ;;
            1) echo "::error::app source rules — the gate ran and FAILED. Its ✗ lines are above"; exit 1 ;;
            *) echo "::error::app source rules — exit $gate_exit is neither its pass (0) nor its failure (1); that is evidence for no side"; exit 1 ;;
          esac
          # THE FACTS, ASSERTED SEPARATELY FROM THE EXIT CODE. A gate whose
          # population is empty exits 0 while inspecting nothing, which is this
          # phase's signature defect; these two numbers are what make that
          # visible. The gate refuses on an empty wrapped-type list itself, and
          # this is the second, independent reading of the same fact.
          status=0
          types=$(sed -n 's/^app_source_rules_wrapped_types=//p' "$out")
          lanes=$(sed -n 's/^app_source_rules_submit_lanes=//p' "$out")
          echo "app_source_rules_wrapped_types=$types"
          echo "app_source_rules_submit_lanes=$lanes"
          [ -n "$types" ] || { echo "::error::app source rules — no type was found wrapped into the scene's content, so the UL-087 clause asserted nothing"; status=1; }
          [ "${lanes:-0}" -ge 2 ] || { echo "::error::app source rules — found ${lanes:-0} submit_for_review override(s), expected both platforms'; the CR-01 clause did not see the lanes it exists to check"; status=1; }
          exit "$status"
